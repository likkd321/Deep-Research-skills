topic: 宁德时代商业模式与护城河的价值投资评估
request: 依据两份已上传报告（《看懂商业模式》《护城河从哪来》）中价值投资派对好商业模式、好护城河的判断框架，逐个判断角度分析宁德时代达到什么程度，说明理由并按10分制简要打分。
started_at: 2026-11-04T18:19+08:00
reference_reports:
  - 看懂商业模式（价值投资第二课）：巴菲特五件事、三种储蓄账户（喜诗/飞安/航空）、看懂10问、好懂vs假好懂、画像清单
  - 护城河从哪来（价值投资第三课）：晨星五大来源、赫尔默7 Powers、先发与飞轮、多尔西四种假护城河、看账→四问审讯→盯趋势、持久性星级
common_context: >-
  对象为宁德时代（CATL，300750.SZ / 3750.HK）。时间范围以2021年至今为主（含2025年报、2026年中报与三季报），必要时回看2018年上市以来的长期序列。
  每个item是一个判断角度：先写清它对应两份报告中的哪条标准，再给出宁德的核心数据、正反证据、和报告中标杆（喜诗、Visa、茅台、开市客、BNSF、航空、诺基亚等）的对照、趋势、十年情景，最后按10分制打分。
  优先用一手来源（年报、季报、业绩说明会/电话会纪要、交易所公告、招股书），二手数据要标明，并尽量与一手来源核对。
items:
  # ---------- A. 商业模式 ----------
  - name: BM1_一句话测试与收入结构
    category: 商业模式
    description: >-
      对应「一句话测试」「收入来源少而清楚，主业占大头」「好懂vs假好懂」。用不超过30字说清宁德卖什么给谁、凭什么赚钱；
      拆分收入与毛利结构：动力电池、储能电池、电池材料与回收、矿产资源及其他，国内与海外；2021年至2026年前三季度的变化，含储能占比升到约两成的说法（待核）。
      判断它更像「真好懂」还是「假好懂」（周期股、科技硬件的特征）。
  - name: BM2_谁付钱与收入可重复性
    category: 商业模式
    description: >-
      对应「谁付钱、为什么付钱、为什么非它不可、收入能重复吗」。客户是车企与储能集成商/电网/电站开发商；前五大客户占比历年变化（特斯拉、理想、蔚来、宝马、奔驰、大众等）；
      车型定点周期与长协/框架协议的期限；储能大单的性质（一次性项目还是持续复购）；付钱的是不是最终用户（终端消费者感知弱）。
  - name: BM3_资本开支与再投入强度
    category: 商业模式
    description: >-
      核心item。对应巴菲特「三种储蓄账户」（喜诗/飞安/航空）和「利润增长时资产负债表要不要跟着膨胀」。数据：历年资本开支（购建固定资产等支付的现金）、资本开支占营收和经营现金流的比例、资本开支对折旧倍数、固定资产+在建工程规模、产能（GWh）扩张；
      增量资本回报（近3–5年新增投入资本 vs 新增税后经营利润）；海外建厂（匈牙利德布勒森、德国图林根、西班牙斯特兰蒂斯合资、印尼）的投入与进度；
      技术授权（LRS，License-Royalty-Service，授权-使用费-服务）轻资产模式（福特密歇根工厂等）对资本开支逻辑的改变。判断宁德属于哪一类账户。
  - name: BM4_现金流质量与回报率
    category: 商业模式
    description: >-
      核心item。对应「现金比利润诚实」「ROIC/ROE长期高于15%–20%且不靠高负债」「自由现金流强、能持续分红回购」。数据：2018年以来历年ROE、ROIC、经营现金流/净利润、FCF/净利润、资产负债率与有息负债、货币资金；
      分红率（2024年起提高）、2026年拟回购计划、H股上市与增发的融资和稀释；区分经营现金流中来自应付/票据扩张的部分。与喜诗、茅台、Visa的回报率对照。
  - name: BM5_定价权与毛利率稳定性
    category: 商业模式
    description: >-
      对应「有定价权吗：过去涨过价吗，涨价后销量掉没掉」和护城河报告的「涨价测试」「毛利率稳」。数据：近8–12个季度的毛利率、单位售价与单位成本（元/Wh）、碳酸锂价格走势；
      2022年锂价暴涨时的成本传导（锂价联动定价、涨价能力）与2023–2025年降价周期中毛利率反而上升的原因；2026年二、三季度毛利率连续回落（约20.7%，待核）与营收增速快于利润增速的含义；
      分业务、分地区毛利率（海外约30%、国内约21%，待核）。判断这是真正的定价权还是成本传导+规模摊薄。
  - name: BM6_上下游话语权与营运资金占用
    category: 商业模式
    description: >-
      对应「上下游谁说了算」「最好有预收款、少应收」。数据：应付账款+应付票据、合同负债/预收、应收账款与票据、存货、预付款项的历年规模；净营运资金占用（应付+合同负债−应收−预付−存货）及占营收比例；现金周转天数；
      对锂矿等上游的议价（长协、参股锁矿）；对车企的议价（是否收预付款、给车企降价的压力）；2026年6月行业《供应商账款支付规范倡议》（60天账期）对这一隐性优势的影响。
  - name: BM7_变化速度与十年后还在吗
    category: 商业模式
    description: >-
      核心item，深度判断。对应巴菲特「变化少回报反而高」、段永平「十年后营业额和利润都不低于今天」、护城河报告「问题四：十年后它还在吗」和林迪效应。
      分析技术路线演进（磷酸铁锂/三元、钠离子、半固态/全固态、大圆柱、4680、凝聚态、新体系）对宁德的冲击或加持；车企自研电池（比亚迪弗迪、特斯拉、大众/国轩、通用、丰田、各家新势力自研）；
      需求侧（电动车渗透率、储能、AIDC数据中心、重卡/船舶/航空电动化）；产能过剩周期。给出十年后（2036年）乐观、中性、悲观三种样子，判断它是否满足「十年后营业额和利润不低于今天」。
  - name: BM8_政策与地缘依赖
    category: 商业模式
    description: >-
      深度判断。对应「不靠政策补贴」「不为清单：不碰靠补贴或政策活的」和持久性星级里的「政策红利/补贴★」。回顾早期补贴与「白名单」对宁德崛起的作用；
      当前国内政策依赖程度（以旧换新、储能政策、出口管制与技术出口限制）；美国IRA/FEOC条款、美国国防部1260H清单、美国关税；欧盟反补贴与本地化要求；技术授权模式作为应对手段的有效性。判断宁德的生意在多大程度上「靠政策活」。
  # ---------- B. 护城河 ----------
  - name: M1_规模经济与成本优势
    category: 护城河
    description: >-
      核心item。对应晨星「成本优势」、7 Powers「规模经济」和持久性星级「低成本+规模★★★★」。数据：全球与中国动力电池装机份额（SNE Research、中国汽车动力电池产业创新联盟）、储能出货份额；总产能与产能利用率；
      单位成本/单Wh毛利与比亚迪、LG新能源、中创新航、国轩、亿纬、松下、三星SDI对比；采购规模带来的材料议价；研发和设备摊薄。回答「给你100亿/1000亿，能打败它吗」。
  - name: M2_技术专利与流程优势
    category: 护城河
    description: >-
      深度判断。对应7 Powers「流程优势」、持久性星级「技术领先/专利★★」、多尔西「好产品不是护城河」。数据：研发投入与占比、研发人员、专利数量与诉讼；产品矩阵（麒麟、神行一至三代、骁遥、钠新、天恒储能、凝聚态）是领先还是会被追平；
      制造流程（极限制造、PPB级缺陷率、良率、灯塔工厂）是否属于「抄几十年也抄不全」的内隐能力；钠离子、固态等新技术从发布到量产/订单的兑现情况。判断技术领先能维持多久、是否已沉淀成客户锁定。
  - name: M3_转换成本与客户锁定
    category: 护城河
    description: >-
      深度判断。对应晨星「转换成本」和四问之「客户为什么不换」。车型电池的认证/验证周期、平台化设计与电池包结构绑定（CTP、底盘一体化CIIC）、质量和安全记录在车企选型中的权重；
      车企引入多家供应商、扶持二供（中创新航、亿纬等）与自研/垂直整合的进展（2026年多个品牌公布自研电池），以及车企向下游压价的能力。判断转换成本是真高还是只是「暂时没有更好的选择」。
  - name: M4_品牌心智与生态网络效应
    category: 护城河
    description: >-
      对应晨星「无形资产（品牌）」「网络效应」、护城河报告「心智占领」「生态系统」真假判定。分析「宁德时代inside」/车企宣传中标注宁德电池对消费者购车的影响（是否能为同样的东西多收钱）；
      巧克力换电（时代电服）的网络规模与车企接入；电池银行、储能运营等是否形成「用户越多越好用」的网络效应，还是只是业务拼盘。
  - name: M5_垄断性资源与产业链一体化
    category: 护城河
    description: >-
      对应7 Powers「垄断性资源」与晨星「成本优势」的上游来源。宁德的锂矿与资源布局（江西宜春枧下窝锂云母矿及其停产/复产、玻利维亚、刚果Manono等）、镍钴资源、邦普回收的规模与回收率、正极前驱体等材料自供比例；
      这些资源是不是「绝版资源」，在锂价下行周期中是资产还是包袱；对碳酸锂价格波动的利润弹性与库存损益。
  - name: M6_份额趋势与竞争格局
    category: 护城河
    description: >-
      核心item，深度判断。对应「份额稳：5年内份额变化2%以内」「沟在变宽还是变窄」和诺基亚份额教训。数据：2018年以来全球与中国动力电池份额曲线（宁德、比亚迪、LG、中创新航、国轩、松下等）、海外市场份额、储能份额；
      价格战与行业产能过剩；韩系、日系退守；行业集中度变化；变宽/变窄信号逐项打勾（提价能力、续费复购类指标、新模式、管理层动作）。综合判断护城河趋势。
  - name: M7_价投派观点与第三方评级
    category: 护城河
    description: >-
      深度判断。对应护城河报告说明中「巴菲特（报纸）和段永平（宁德时代）也看错过」。收集段永平关于宁德时代的原话与时间、后来的反思；其他价投派/知名机构（高瓴张磊、但斌、张坤、李录、芒格「太难」堆说法等）的观点；
      晨星对宁德护城河评级（据报道2026年由「无」上调为「窄」，待核）及理由；卖方机构对护城河的主要论点。整理「100亿测试」的各方回答，并对照本次研究其他维度的结论；附估值快照（日期、股价、PE/PB）作为「最后才谈价格」的背景，但不做估值。
  
execution:
  mode: 标准
  batch_size: 2
  core_items: [BM3_资本开支与再投入强度, BM4_现金流质量与回报率, BM7_变化速度与十年后还在吗, M1_规模经济与成本优势, M6_份额趋势与竞争格局]
  items_per_agent: 2-3
  judgment_items: [BM7_变化速度与十年后还在吗, BM8_政策与地缘依赖, M2_技术专利与流程优势, M3_转换成本与客户锁定, M6_份额趋势与竞争格局, M7_价投派观点与第三方评级]
  agent_groups:
    - {agent: web-search-agent-deep, model: opus, items: [BM7_变化速度与十年后还在吗]}
    - {agent: web-search-agent-deep, model: opus, items: [M6_份额趋势与竞争格局]}
    - {agent: web-search-agent, model: sonnet, items: [BM3_资本开支与再投入强度]}
    - {agent: web-search-agent, model: sonnet, items: [BM4_现金流质量与回报率]}
    - {agent: web-search-agent, model: sonnet, items: [M1_规模经济与成本优势]}
    - {agent: web-search-agent-deep, model: opus, items: [M2_技术专利与流程优势, M3_转换成本与客户锁定]}
    - {agent: web-search-agent-deep, model: opus, items: [BM8_政策与地缘依赖, M7_价投派观点与第三方评级]}
    - {agent: web-search-agent, model: sonnet, items: [BM1_一句话测试与收入结构, BM2_谁付钱与收入可重复性, BM6_上下游话语权与营运资金占用]}
    - {agent: web-search-agent, model: sonnet, items: [BM5_定价权与毛利率稳定性, M5_垄断性资源与产业链一体化, M4_品牌心智与生态网络效应]}
  output_dir: ./results
