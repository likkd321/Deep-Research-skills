topic: 储能与动力电池：行业前景、发展阶段与需求驱动力（宁德时代长期价投视角）
request: 为长期价投宁德时代，研判储能行业的发展前景、当前所处阶段（相当于人类多少岁）、需求驱动力及各自占比（未来5–10年），以及需求是数年内持续、数十年不断增长还是可预见未来一直不俗；并对动力电池做对等分析；最后按约30年维度给电池行业前景打分，并与芯片等典型行业横向对比。
started_at: 2026-09-25T11:48+08:00
generated_date: 2026-09-25
time_range: 最新为准，重点2025–2026（历史数据回溯至2018年看趋势；预测、政策、价格以2025–2026最新口径为准）

questions:
  - 储能行业的发展前景如何（未来5–10年规模与增速）？
  - 储能当前处于什么发展阶段，相当于人类多少岁？
  - 储能需求的驱动力主要有哪些，各自占比多少（未来5–10年）？
  - 储能是数年内有持续需求、数十年不断增长，还是可预见的未来一直需求不俗？
  - 动力电池的同样四个问题：前景、阶段（人类年龄）、驱动力与占比、需求持续性。
  - 这对宁德时代的长期投资意味着什么？
  - 电池行业（储能、动力电池）按约30年维度的前景评分如何？与芯片及其他典型行业相比如何？

report_requirements:
  - 前景评分以约30年为维度（2026–2055），储能与动力电池分别打分，并与芯片（半导体，含AI算力芯片与成熟制程）及其他典型行业（如光伏、智能手机、白酒/必选消费、互联网平台、创新药、银行、石油、整车）横向对比。
  - 评分由主线程基于全部调研与自身知识综合给出，不单独派子agent搜索；各行业统一用同一套维度（需求天花板、成长跑道长度、需求确定性、竞争格局与盈利能力、技术颠覆风险、资本强度与周期性）。
  - 驱动力占比须归一到100%（储能按应用场景、动力电池按车型/区域），并标明哪些是推算。
  - 需求持续性要在"数年内持续 / 数十年持续增长 / 可预见未来稳定不俗"三者中明确给出答案。

step2_merge_note: >
  Step 2补充建议已并入现有item而非另开：上游锂资源与回收/梯次利用并入"锂电池价格、产能与价值量"，
  梯次利用对新增储能需求的分流并入"技术路线演进与替代风险"，贸易壁垒与地缘并入"宁德时代定位与暴露"及"海外乘用车""电网侧大储"，
  电动船舶在"其他新兴动力场景"中加重权重；出口与贸易政策写进 economics_and_policy_dependence 字段。

items:
  - name: 储能行业整体（全球）
    slug: ess_overall
    category: 储能
    description: >
      全球储能行业全景与总判断（以锂电为主的新型储能为主体，抽水蓄能等作对照）。深挖：
      (1) 2018–2025年及2026年最新的全球新增装机（GW/GWh）与储能电芯出货（GWh）历年数据与增速，中国/美国/欧洲/中东/其他区域结构；
      (2) 2030/2035/2050多机构预测（BNEF、IEA、Wood Mackenzie、CNESA、InfoLink、SNE、TrendForce、GGII、券商），给出基准/乐观/悲观区间，并把GWh折算为价值量；
      (3) 需求的应用结构——电网侧与新能源配套大储/工商业/户用/AI数据中心/离网弱电网与备电——当前、2030、2035份额，合计100%，作为全局口径供其他细分item对齐；
      (4) 储能与新能源的配比（新增储能GWh/新增风光GW）、新能源发电占比与储能需求的非线性关系（渗透率越高越需要长时储能）；
      (5) 总体发展阶段：按统一人类年龄标尺给出具体年龄，写明进度指标（如当前年需求/长期稳态年需求），并与光伏、风电、电动车的历史阶段类比；
      (6) 需求持续性总判断（A/B/C），论证长期天花板（IEA净零/既定政策情景、BNEF NEO对2040–2050储能需求，尽量外推到2055年前后）与电池寿命（10–20年）带来的替换需求；
      (7) 在core_conclusion末尾另起一段，按约30年维度（2026–2055）给出储能行业前景的初步评分：需求天花板、成长跑道长度、需求确定性（政策与周期）、竞争格局与盈利能力、技术颠覆风险（风险越低分越高）、资本强度与周期性（越轻分越高），每项1–10分并各用一句话说理，供报告与芯片等行业横向对比。
      线索（需核实）：BNEF预测2026年全球储能新增约158GW。

  - name: 电网侧与新能源配套大储
    slug: ess_utility_scale
    category: 储能
    description: >
      表前/公用事业级储能，当前最大的需求来源。深挖：
      (1) 规模：全球及中国/美国/欧洲/中东/澳洲/智利/印度等表前储能新增装机与占全球储能份额，2030/2035预测；
      (2) 驱动力拆分及各自权重：新能源消纳与弃电、容量充裕度/尖峰负荷、调频等辅助服务、输配电阻塞缓解与替代、电力现货套利；
      (3) 中国：136号文（2025年2月，不再把配储作为新能源项目核准/并网的前置条件）之后，独立/共享储能靠什么赚钱——容量电价（线索：2026年初国家层面出台电网侧独立新型储能容量电价机制，需核实）、现货价差、辅助服务；2025–2026年招标量与装机是否因取消强制配储而下滑或反而增长；《新型储能规模化建设专项行动方案（2025–2027年）》目标；
      (4) 美国：储能ITC延续、OBBBA之后的FEOC限制与关税对中国电池的影响，ERCOT/CAISO装机与收益变化（价差是否被储能自身压缩）；
      (5) 欧洲（英国、德国、意大利MACSE拍卖等）、中东（沙特、阿联酋超大光储项目）、澳洲、智利、印度招标；
      (6) 储能时长从2h→4h→8h演进对GWh需求的放大效应；
      (7) 经济性：各主要市场储能项目IRR、LCOS与燃气调峰电厂对比；
      (8) 该场景的发展阶段（人类年龄）与需求持续性。

  - name: 工商业储能
    slug: ess_commercial_industrial
    category: 储能
    description: >
      表后工商业储能（C&I）。深挖：
      (1) 全球及中国/欧洲/美国/新兴市场工商业储能装机、占全球储能份额与增速，2030/2035预测；
      (2) 驱动力及权重：峰谷价差套利、需量电费管理、需求响应/虚拟电厂、备电与电能质量、光储一体与自发自用、充电站配储；
      (3) 中国分时电价调整（午间低谷、峰谷价差变化）与2025年分布式光伏新政对收益率的影响；
      (4) 投资回收期与IRR；
      (5) 发展阶段（人类年龄）与需求持续性；
      (6) 主要玩家与宁德时代的位置。

  - name: 户用储能
    slug: ess_residential
    category: 储能
    description: >
      户用储能。深挖：
      (1) 全球户储装机/出货、占全球储能份额与增速（欧洲德意英、澳洲、美国、日本等），2030/2035预测；弱电网地区的家庭光储归入"离网弱电网备电与新兴市场储能"item，此处注明口径；
      (2) 驱动力：高电价与自发自用、净计量政策退坡（如加州NEM 3.0、荷兰取消净计量）、备电与极端天气、补贴（如澳洲2025年7月起的Cheaper Home Batteries计划）；
      (3) 2023–2024年欧洲去库存之后的复苏程度；
      (4) 经济性（回收期）；
      (5) 发展阶段（人类年龄）与需求持续性；
      (6) 宁德时代在户储电芯中的位置（品牌方如特斯拉Powerwall、比亚迪、派能、Sonnen等）。

  - name: AI数据中心储能
    slug: ess_ai_datacenter
    category: 储能
    description: >
      AI数据中心带来的储能需求——最新、争议最大的驱动力。深挖：
      (1) 需求机制拆分：①服务器/机柜级BBU与UPS锂电化（替代铅酸）；②数据中心园区表后储能（平滑AI训练负荷的功率波动、离网/自供电、替代柴油备电）；③为数据中心接入配套的电网侧储能与"光储+数据中心"项目；④电网因数据中心负荷增长而产生的间接储能需求；
      (2) 量化：各机构/券商对AIDC储能2025/2030/2035的GWh预测及其假设（如IEA数据中心用电预测、每GW数据中心配多少GWh储能），判断可信度与水分（线索：有观点称2030年AI数据中心带来约300GWh储能需求，需核实其口径与假设）；
      (3) 典型案例与订单（如xAI配特斯拉Megapack、云厂商储能采购、宁德/阳光电源/特斯拉等的相关订单）；
      (4) 占全球储能需求的份额（当前→2030→2035），并说明与电网侧大储、工商业口径的重叠；
      (5) 发展阶段（人类年龄）与需求持续性（与AI资本开支周期的关联、AI投资降温风险）；
      (6) 宁德时代在AIDC的布局。

  - name: 离网弱电网备电与新兴市场储能
    slug: ess_offgrid_emerging
    category: 储能
    description: >
      离网/弱电网、备电与新兴市场的分布式储能。深挖：
      (1) 通信基站备电（锂电替代铅酸）、微电网、海岛与矿区；
      (2) 弱电网/缺电地区光储：巴基斯坦光伏+储能爆发、南非限电、尼日利亚、黎巴嫩、东南亚（菲律宾、越南等）、拉美、非洲离网光储；
      (3) 规模、占全球储能份额、增速与2030/2035预测；
      (4) 驱动力：电网不可靠，加上组件与电池降价后"光伏+电池"比柴油发电更便宜；
      (5) 发展阶段（人类年龄）与需求持续性；
      (6) 宁德时代的位置。
      注意：中东、智利等大型地面电站配储归入"电网侧与新能源配套大储"，本item聚焦分布式、离网与备电。

  - name: 动力电池行业整体（全球）
    slug: ev_battery_overall
    category: 动力电池
    description: >
      全球动力电池全景与总判断。深挖：
      (1) 2015–2025年及2026年最新的全球动力电池装车量（SNE Research、中国汽车动力电池产业创新联盟等），分区域（中国/欧洲/北美/其他）与车型（纯电/插混增程/商用车/其他）结构；全球及中欧美与新兴市场新能源车销量与渗透率；
      (2) 2030/2035多机构预测（BNEF EVO、IEA Global EV Outlook、SNE、Rho Motion、GGII、EVTank、券商），基准/乐观/悲观区间，GWh与价值量；
      (3) 单车带电量趋势（纯电/插混/增程/商用车），混动与增程对带电量的影响；
      (4) 天花板推算：全球汽车年销量约9000万辆、保有量约15亿辆，全面电动化后的稳态年需求（TWh）与峰值/平台时点，以及存量电动车的换电池需求；
      (5) 总体发展阶段：按统一人类年龄标尺给出具体年龄，写明进度指标（全球新车渗透率、保有量渗透率、当前年需求/稳态年需求），并与智能手机、汽车等历史类比；
      (6) 需求持续性总判断（A/B/C），尽量外推到2055年前后；
      (7) 驱动力结构（中国乘用车/海外乘用车/商用车/其他新兴场景）当前、2030、2035份额，合计100%，作为全局口径供细分item对齐；
      (8) 在core_conclusion末尾另起一段，按约30年维度（2026–2055）给出动力电池行业前景的初步评分：需求天花板、成长跑道长度、需求确定性（政策与周期）、竞争格局与盈利能力、技术颠覆风险（风险越低分越高）、资本强度与周期性（越轻分越高），每项1–10分并各用一句话说理，供报告与芯片等行业横向对比。

  - name: 中国乘用车
    slug: ev_china_passenger
    category: 动力电池
    description: >
      中国新能源乘用车的动力电池需求。深挖：
      (1) 2018–2025年及2026年最新的销量、渗透率（零售/批发口径）、纯电/插混/增程结构与装车量（线索：2026年上半年新能源渗透率约62.8%、出口大增，需核实口径）；
      (2) 渗透率过半之后增量从哪来：剩余燃油车替代、单车带电量提升（插混/增程大电池化、纯电长续航）、出口（整车出口与海外建厂，说明出口车电池计入哪个口径）、换电等；
      (3) 政策：2026–2027年购置税减半、以旧换新补贴变化、反内卷与价格战；
      (4) 2030/2035预测（销量、渗透率、GWh）与饱和时点；
      (5) 占全球动力电池需求的份额（当前→2030→2035）；
      (6) 发展阶段（人类年龄）与需求持续性；
      (7) 宁德时代的国内份额变化，及与比亚迪等的竞争。

  - name: 海外乘用车
    slug: ev_overseas_passenger
    category: 动力电池
    description: >
      中国以外的新能源乘用车动力电池需求。深挖：
      (1) 欧洲：销量与渗透率、欧盟CO2标准（2025–2027年三年平均考核等放宽、2035目标的调整）、对华电动车关税与价格承诺；
      (2) 美国：OBBBA取消7500美元购车抵免（2025年9月底）后的销量变化、排放与油耗规则放松、FEOC对电池本土化的要求；
      (3) 新兴市场：东南亚（泰国、越南、印尼、马来西亚）、拉美（巴西、墨西哥）、印度、中东、土耳其等的电动车放量与中国品牌出海；日韩；
      (4) 2030/2035预测（销量、渗透率、GWh）；
      (5) 占全球动力电池需求的份额（当前→2030→2035）；
      (6) 发展阶段（人类年龄）与需求持续性；
      (7) 宁德时代的海外客户与工厂（德国、匈牙利、西班牙、印尼等）及授权模式，与LG新能源、松下、三星SDI、SK On等的竞争。

  - name: 商用车电动化
    slug: ev_commercial_vehicles
    category: 动力电池
    description: >
      商用车与非道路车辆的动力电池需求。深挖：
      (1) 电动重卡：中国2024–2026年销量与渗透率、单车带电量（约300–600kWh）、换电模式、TCO平价逻辑与油电价差；欧美电动重卡进展；
      (2) 客车、轻卡/物流车/VAN、工程机械（装载机、挖掘机）、矿卡、港口机械；
      (3) 装车量、占全球动力电池需求份额（当前→2030→2035）与2030/2035预测；
      (4) 与氢燃料电池、LNG重卡的竞争；
      (5) 发展阶段（人类年龄）与需求持续性；
      (6) 宁德时代的布局（骐骥换电、重卡电池份额等）。

  - name: 其他新兴动力场景
    slug: ev_other_emerging
    category: 动力电池
    description: >
      其他动力电池应用场景。深挖：
      (1) 两轮/三轮电动车（中国新国标、印度与东南亚锂电替代铅酸，含钠电机会）；
      (2) 电动船舶（内河、近海、渡轮、港口船舶）——重点展开，给出规模与增速；
      (3) 航空：eVTOL/低空经济、电动飞机；
      (4) 人形机器人与其他机器人；
      (5) 铁路、叉车等；
      (6) 各自规模（GWh）、增速、2030/2035预测，及合计占全球动力电池需求的份额；
      (7) 何时能成为可观的增量；
      (8) 发展阶段（人类年龄）与需求持续性；
      (9) 宁德时代的布局（船舶、eVTOL、钠电两轮等）。

  - name: 锂电池价格、产能与价值量
    slug: price_capacity_value
    category: 交叉
    description: >
      从"量"到"钱"的传导，含上游资源与回收。深挖：
      (1) 2018–2026年锂电池电芯与系统价格走势（BNEF电池包价格调查、储能电芯与系统中标价、动力电芯价格），以及与碳酸锂价格周期的关系；
      (2) 上游：锂资源供需与价格周期（盐湖、锂矿新增供给）、镍钴，头部电池厂的资源布局；
      (3) 行业名义产能、产能利用率与过剩程度，2025年起"反内卷"政策（工信部约谈电池企业等）的执行效果与价格企稳/反弹信号；
      (4) 2030/2035价格预测与学习曲线；
      (5) 储能与动力的市场规模（金额）＝量×价，价值量增速是否明显低于GWh增速；
      (6) 利润池：电芯环节毛利率（宁德、比亚迪、LG新能源、亿纬锂能、海辰等）、储能系统集成与电芯的利润分配；
      (7) 回收与梯次利用：规模、再生材料对新增原料需求的替代比例、宁德时代邦普的地位与贡献；
      (8) 对长期投资者的含义：GWh增长能否转化为收入与利润。

  - name: 宁德时代定位与暴露
    slug: catl_positioning
    category: 交叉
    description: >
      宁德时代与两大赛道的连接，含出海与地缘。深挖：
      (1) 收入与利润结构：2023–2025年及2026年上半年动力电池、储能、材料、其他业务的收入/毛利率/占比，以及动力与储能出货量（GWh）；
      (2) 全球份额及趋势：动力（SNE口径、国内联盟口径）、储能电芯（InfoLink/SNE等口径），与比亚迪、LG新能源、中创新航、亿纬锂能、海辰、国轩、瑞浦等对比；份额是否在下滑，原因是什么；
      (3) 产能与扩产、海外布局（德国、匈牙利、西班牙、印尼等）与授权模式（LRS，如福特）；
      (4) 出海与地缘：美国FEOC与相关清单审查、欧盟反补贴调查、中国电池出口退税调整等的影响；
      (5) 产品与技术储备（麒麟、神行、骁遥、天恒、587Ah储能电芯、钠新、固态、巧克力换电、骐骥重卡换电）；
      (6) 储能订单与在手订单、海外储能客户；
      (7) 在各细分场景的卡位与受益程度；
      (8) 管理层对行业需求的最新判断（业绩会/电话会）。

  - name: 技术路线演进与替代风险
    slug: tech_substitution
    category: 交叉
    description: >
      判断技术演进是"分流"还是"做大"电池需求。深挖：
      (1) 锂电内部演进：磷酸铁锂与三元、磷酸锰铁锂、大容量储能电芯（500Ah+）、固态/半固态的商业化时间表与成本（2027–2030），以及这些演进会不会给后来者弯道超车的机会；
      (2) 钠离子电池：成本与性能、量产进展（如宁德钠新）、在储能/两轮/小型车/启停等场景的替代空间；
      (3) 非锂储能：抽水蓄能（中国大规模在建）、压缩空气、液流电池（全钒/铁铬）、铁-空气、重力储能、氢储能、热储能——在长时储能（8h+）上的成本曲线与份额预测，是否会分流锂电储能需求；
      (4) 梯次利用电池进入储能对新增储能电芯需求的分流程度；
      (5) 动力领域的氢燃料电池（重卡）、合成燃料等替代威胁；
      (6) 结论：未来5–10年及约30年维度，技术替代分别对"电池/储能总需求"、"锂电需求"与"宁德时代"有什么影响，给出风险等级与时间点。

execution:
  mode: 标准            # 性能/标准/经济；标准=判断型item用Opus，检索型用Sonnet；报告综合始终Opus
  batch_size: 2          # 每批最多同时运行2个子agent
  core_items:            # 重点核心item，各自单独一个子agent
    - 储能行业整体（全球）
    - 动力电池行业整体（全球）
    - 电网侧与新能源配套大储
    - AI数据中心储能
    - 技术路线演进与替代风险
  items_per_agent: 2-3   # 非核心item每个子agent负责2–3个
  judgment_items:        # 需要大量深度判断：派 web-search-agent-deep（effort high），标准模式下用Opus
    - 储能行业整体（全球）
    - 动力电池行业整体（全球）
    - 电网侧与新能源配套大储
    - AI数据中心储能
    - 技术路线演进与替代风险
  agent_groups:          # 实际派发分组，每组=一个子agent，按派发顺序排列（第2批起按用户要求每批1个Opus组+1个Sonnet组）
    - {agent: web-search-agent-deep, model: opus, items: [储能行业整体（全球）]}           # 第1批
    - {agent: web-search-agent-deep, model: opus, items: [动力电池行业整体（全球）]}       # 第1批
    - {agent: web-search-agent-deep, model: opus, items: [电网侧与新能源配套大储]}         # 第2批
    - {agent: web-search-agent, model: sonnet, items: [工商业储能, 户用储能, 离网弱电网备电与新兴市场储能]}  # 第2批
    - {agent: web-search-agent-deep, model: opus, items: [AI数据中心储能]}                 # 第3批（用户指定本批3个并行：2 Opus + 1 Sonnet）
    - {agent: web-search-agent-deep, model: opus, items: [技术路线演进与替代风险]}         # 第3批
    - {agent: web-search-agent, model: sonnet, items: [中国乘用车, 海外乘用车]}            # 第3批
    - {agent: web-search-agent, model: sonnet, items: [商用车电动化, 其他新兴动力场景]}    # 第4批
    - {agent: web-search-agent, model: sonnet, items: [锂电池价格、产能与价值量, 宁德时代定位与暴露]}  # 第4批
  output_dir: ./catl-storage-power-battery/results
