topic: 储能与动力电池：行业前景、发展阶段与需求驱动力（宁德时代长期价投视角）

fields:
  核心结论:
    - name: core_conclusion
      description: >
        针对本item的直接回答（先结论后依据）：前景如何（未来5–10年规模与增速）、处于什么阶段（相当于人类多少岁）、
        靠什么驱动、需求能持续多久；给出明确判断，不和稀泥。交叉item（价格与价值量/宁德时代/技术替代）按其视角作答。
      detail_level: 详细

  规模与现状:
    - name: current_scale_and_history
      description: >
        历史与现状数据（约2018–2025年，及2026年上半年/最新）：年新增装机/电芯出货/装车量（GWh，储能另给GW）、
        同比增速、占行业总需求份额、区域结构；逐条标注口径（装机vs出货、电芯vs系统、GWh vs GW、中国口径vs全球口径）、时间与出处。
      detail_level: 详细

  未来5-10年预测:
    - name: forecast_2030_2035
      description: >
        2030年、2035年需求预测：列出多家机构（如BNEF、IEA、Wood Mackenzie、SNE Research、InfoLink、TrendForce、
        GGII高工、EVTank、CNESA中关村储能产业技术联盟、Rho Motion、Benchmark及主流券商）的预测值与隐含CAGR，
        给出基准/乐观/悲观区间并解释分歧来源；尽量同时给数量（GWh）与价值量（金额，或按单价×数量推算）。
      detail_level: 详细

  驱动力与占比:
    - name: demand_drivers_and_shares
      description: >
        需求驱动力拆解与量化占比。行业整体item：给出按应用场景与区域的需求份额结构（当前、2030、2035，各自合计100%），
        并说明底层驱动因素（新能源渗透、电价与峰谷价差、政策、成本下降、负荷增长、车辆电动化等）；
        细分场景item：给出本场景占行业总需求的份额（当前→2030→2035）及其内部子驱动的拆分，并说明与其他场景的口径重叠；
        交叉item：给出与本主题相关的结构拆分。份额须注明口径与推算方法（机构数据还是自行推算）。
      detail_level: 详细

  经济性与政策依赖:
    - name: economics_and_policy_dependence
      description: >
        需求是靠经济性自发驱动，还是靠政策补贴/强制驱动：关键经济性指标（如储能项目IRR、度电成本LCOS、峰谷价差、容量电价收入；
        电动车与燃油车购置价/TCO平价；电池包价格$/kWh）；关键政策（中国136号文与新能源全面入市、容量电价与现货市场、
        新型储能专项行动；美国IRA/OBBBA税收抵免与FEOC限制；欧盟碳排放法规与2035目标调整、电池法规；各国补贴）
        以及贸易与出口政策（关税、反补贴调查、出口退税调整、本土化要求）对该场景放量节奏的影响；判断"政策退潮后还剩多少需求"。
      detail_level: 详细

  发展阶段:
    - name: lifecycle_stage
      description: >
        生命周期阶段（导入/快速成长/成长后期/成熟/衰退）+ 相当于人类多少岁（给一个具体年龄，或宽度不超过5岁的区间）。
        统一标尺（人类寿命按约80岁；以"距长期饱和规模的进度/S曲线位置/渗透率"为主，增速、经济性是否已脱离补贴自立、竞争格局、技术成熟度为辅）：
        0–5岁 示范期；6–12岁 导入后段（进度<10%）；13–18岁 青春期快速成长（进度10–30%、年增速30%+、格局未定）；
        19–30岁 青年/成长后期（进度30–60%、增速10–25%）；31–45岁 壮年/成熟早期（进度60–85%、替换需求上升）；
        46–65岁 中年/成熟期（以替换为主、增速≈GDP）；65岁+ 衰退/被替代。
        须写明所用的进度指标及其数值（如渗透率、当前年需求/长期稳态年需求），并给出可类比的历史行业及其当年所处位置（如光伏、智能手机、汽车）。
      detail_level: 详细

  需求持续性:
    - name: demand_durability
      description: >
        需求持续性研判，在三者中明确选一并说理：A 数年内持续（阶段性/周期性高景气，之后可能明显回落）；
        B 数十年持续增长；C 可预见未来稳定不俗（增长终将放缓，但会长期停在高位平台）。
        须讨论：长期天花板与稳态年需求（2040–2050情景，如IEA/BNEF净零或既定政策情景，并尽量外推到约30年后的2055年前后）、饱和时点、
        存量替换/更新需求（电池寿命与更新周期）、周期性与需求透支风险、梯次利用与回收的影响、
        技术替代对"电池/储能总需求"与"锂电需求"的不同影响。
      detail_level: 详细

  风险与分歧:
    - name: risks_and_divergence
      description: >
        下行风险与多空分歧：各机构预测分歧及原因、政策逆转、价格战与产能过剩、贸易壁垒与地缘（关税、FEOC、本土化要求）、
        技术替代、需求透支或周期回落、安全事故等；给出一个数值化的悲观情景及其触发条件。
      detail_level: 详细

  对宁德时代的含义:
    - name: catl_implications
      description: >
        本item对宁德时代长期投资的含义：宁德在该领域的份额/地位/产品与产能布局（如麒麟、神行、骁遥、天恒、钠新、大容量储能电芯、
        巧克力换电、骐骥换电、海外工厂等）、相对主要竞争对手的位置，以及受益或受损程度（高/中/低）。
      detail_level: 简要

  跟踪指标:
    - name: signals_to_watch
      description: 未来需要持续跟踪的3–6个领先指标/信号（如季度装机与招标量、电芯价格、渗透率、关键政策节点、龙头订单与排产），各注明为何关键。
      detail_level: 简要

  信息来源:
    - name: sources
      description: >
        关键来源，markdown链接[标题](url)，注明发布方与日期；优先一手（官方统计与监管/政策文件、公司财报与公告、业绩说明会/电话会纪要）
        与权威机构（IEA、BNEF、SNE Research、CNESA、InfoLink、中国汽车动力电池产业创新联盟、行业协会）及主流券商研报/权威媒体，至少8条。
      detail_level: 详细

uncertain: []
