    focus:
      - "引擎/中间件换主实现：Unity Multiplayer Services/Netcode 的 Host Migration、Photon Fusion Host Migration、FishNet/Mirror、Epic Online Services、Unreal 社区方案——快照内容与频率、继任者选举、客户端重连流程、停顿时长"
      - "知名游戏换主经验：Call of Duty、Halo、Destiny、GTA Online、Dead by Daylight（为何弃 P2P 转专服）等的停顿时长、触发条件与玩家评价"
