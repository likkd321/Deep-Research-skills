  - name: "带宽与包量测算：16 人同层峰值复核"
    category: "动作联机与换主"
    description: "用核实过的协议开销重新计算各场景下房主上行带宽与包量，复核上一轮数字，并给出 V1.0 人数上限建议。"
    focus:
      - "一手核实开销：Godot SceneMultiplayer RPC 与 send_bytes 的包头字节、MultiplayerSynchronizer 的发送方式；SteamNetworkingSockets/SDR 每包开销（消息头、加密、UDP/IP）；ENet 开销"
      - "自定义打包移动状态的字段（位置/朝向/速度/状态位/floor_id/序号）与字节数；20Hz、30Hz 下 12/16/20/24 人的房主上行与 PPS，分三种分布：同层全员、15–22 层分散、终局 16 人挤天台"
      - "跨楼层声音事件通道（脚步/破门/电梯/枪声向相邻楼层广播）的额外流量"
      - "交火峰值：子弹 RPC（起点+方向）、命中/感染、开箱/拾取事件的频率假设与带宽"
      - "D2 快照字节数（压缩前后）、每 2–3 秒发给 2 名候选的额外上行；中途加入/旁观者初始快照"
      - "家庭宽带上行现实（中国/全球常见上行、Wi-Fi 抖动），12/16/24 人的甜蜜区与上限结论；逐项复核上一轮数字并给出公式"
    prior_claims:
      - "20Hz 自定义打包 send_bytes 约 12 B/人：16 人同层房主上行约 0.6 Mbps，24 人同层约 1.26 Mbps（全员猛开火约 1.7–2.5 Mbps）"
      - "无脑挂 MultiplayerSynchronizer 不合包在 24 人可达 ~8.3 Mbps / 10,120 PPS 并触发 k_EResultLimitExceeded"
      - "按 5 层高楼做楼层 AOI 平时可省 50%–80% 流量；单玩家家宽主机甜蜜区 12–16 人，上限约 20–24 人"
      - "几百个静态编号箱子未打开时闲时流量为 0 B/s，按需 RPC 开箱"

