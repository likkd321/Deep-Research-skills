      - "AppID 480（Spacewar）开发测试的限制；拿到自己 AppID 后的 Steamworks 设置（Lobby、Networking、Cloud）"
      - "Steam Playtest 的流程、限制与主 App 的关系；Steam Next Fest；愿望单转化经验值；国内外社区与主播冷启动渠道（B 站、小黑盒、Reddit、Discord）"
      - "区域定价（人民币推荐价、¥15–48 的定位）、大陆玩家购买支付现状；本地化（中英文）"
      - "Steam Deck 兼容性审核与手柄要求；beta 分支用于联机版本回滚；Steamworks SDK 近期更新（1.63–1.65）中与联机相关的变化"
      - "第三方依赖与素材许可（GodotSteam、Steamworks SDK 再分发、Understudy、字体音效）与借鉴 CSOL 玩法的 IP 边界"
    prior_claims:
      - "AppID 480 与免费 Steam Playtest 可用于真机测试"

  - name: "联机测试工具链与混沌压测"
    category: "运维、发行与测试"
    description: "给出一个人即可执行的联机测试环境与自动化压测方案的工具事实与参数。"
    focus:
      - "Godot 编辑器 Customize Run Instances 的用法与版本；多实例时 user:// 隔离（Windows APPDATA、Linux XDG_DATA_HOME、命令行参数）"
      - "Windows clumsy 0.3（WinDivert）用法、过滤语法、本机回环陷阱与推荐的 4 档弱网参数；Linux tc netem（延迟/抖动/丢包/乱序）"
      - "GNS 内置弱网模拟在 Steam 环境的使用；ENet 侧是否有内置模拟"
      - "同一台电脑运行多个 Steam 客户端/账号的限制与变通（虚拟机、家庭共享、Sandboxie 等是否可行与合规）；双机双账号测试步骤"
      - "Godot headless 自动化：GUT / gdUnit4 headless 运行、命令行参数、日志采集；多进程混沌测试（随机杀进程、断网）脚本思路"
      - "Godot 网络 Profiler/Monitor 与自定义指标（RTT、丢包、抖动、带宽、PPS、换主耗时）"
    prior_claims:
      - "Godot Customize Run Instances 本机 2–4 开；clumsy 0.3 注意本机回环陷阱；Windows 隔离 APPDATA / Linux 隔离 XDG_DATA_HOME"

