topic: "Steam 联机 2D 像素高楼生化撤离游戏「动作轻壳 × 12–16 人 × 40 分钟拉锯 × D4 分权移动 + D2 换主」完整可行性、技术栈、胜率与网络测试方案"
request: "零编程基础的全职个人开发者用 Godot 4（纯 GDScript，AI 代写）+ GodotSteam 做 Steam 买断制 2D 像素俯视角 15–22 层高楼生化撤离联机游戏（12–16 人 + Bot、40 分钟一整局、D4 分权移动 + D2 换主、零对局服、全球含中国大陆）；要求逐条核实上一轮 6 项起点结论，给出可行性评估、可直接喂给 AI 的技术栈与实现方案、工程与商业分开的胜率打分及敏感性分析、可执行的网络测试手册，输出与参考报告排版一致的单文件 HTML。"
started_at: "2026-11-25T14:15+08:00"
time_range: "不限年份；版本号、库状态、Steam 政策与在线数据一律以 2026-11 最新为准"

design_decisions:   # 用户在开跑前确认（2026-11-25）
  floors: "15–22 层：更注重规划的策略性、没看到僵尸时的紧张感，以及靠声音和其他迹象判断危险"
  firing: "360° 鼠标瞄准 vs 4/8 方向由报告评估后推荐"
  checkpoints: "不设阶段检查点，整局一体式撤离（报告可顺带说明另两种：可见阶段目标 / 后台存档点）"
  join_in_progress: "中途加入只能以人类身份；能实现更好（少人数可先开），但担心装备差距导致新人体验差，属锦上添花"
  dev_time: "全职，每周 40+ 小时"
  project_profile: "见 fields.yaml 顶部 project_profile"

prior_round_claims:   # 用户提供的上一轮 6 项起点结论（待核实，不要照搬）
  - "1 引擎与插件：最新稳定版 Godot 4.7.2-stable + GodotSteam v4.24-gde（已迁至 Codeberg，修复 4.17–4.23.2 的 CVE-2026-123017 伪造 peer 1 漏洞）；SteamMultiplayerPeer 丢失 peer 1 会触发 close()；godot-proposals #7912 仍未落地。"
  - "2 中国大陆 SDR 与超时：GetSDRConfig/v1/ 显示第三方独立游戏 0 个中国大陆节点，国内玩家经香港/东京/新加坡/首尔 4 个亚太中继（晚高峰 80–180ms RTT 伴抖动）；GNS TimeoutInitial/TimeoutConnected 默认 10s，但已建连接实际静默断连需 10–21s；Steam Lobby 拔网线约 15–30s，需自写心跳。"
  - "3 带宽与楼层 AOI：未开箱子闲时 0 B/s、按需 RPC 开箱，不挂 MultiplayerSynchronizer；子弹 1 次 RPC 发起点+方向各端本地模拟；20Hz 自定义打包约 12 B/人，16 人同层房主上行约 0.6 Mbps、24 人约 1.26 Mbps（猛开火 1.7–2.5 Mbps）；无脑挂 MultiplayerSynchronizer 24 人可达 ~8.3 Mbps / 10,120 PPS 并触发 k_EResultLimitExceeded；5 层楼层 AOI 省 50%–80%；换主备份每 2–3 秒给前 2 名候选传 5–15 KB；家宽甜蜜区 12–16 人、上限约 20–24 人。"
  - "4 D4 三大手感坑：① 隔空/拐角感染（房主端 120–150ms 上限回溯）；② 关门后 150ms 僵尸本地穿门（房主 prev_pos→new_pos 线段拦截拉回，避免刚体硬碰撞堵门）；③ 高频连发击退抢方向盘（改用减速 Tagging）。"
  - "5 动作中局 D2 与 Understudy：动作中局换主比回合制更割裂，但不刷 AI 尸潮且可丢弃空中 0.3 秒子弹，全楼快照仅 5–15 KB；Understudy v0.1.0（unstable）60Hz 不可靠输入流、2s 踢人超时、禁 Godot 物理、零公网测试，极不适用。"
  - "6 同类先例：Alien Swarm: Reactive Drop（8p，A1+C3，Source 预测+延迟补偿）、Barotrauma（16p，A1+C3，感染+海量物品）、Project Zomboid（4–16p 监听服+箱子惰性同步）、Among Us Hide n Seek（15p 纯 D4 实时追杀）、Don't Starve Together（可切预测开关）；Liar's Bar / Midnight Ghost Hunt / Bodycam 的换主翻车与补丁史。"

items:
  # ───────────── 引擎与插件 ─────────────
  - name: "Godot 4 引擎现状与多人联机底层 API"
    category: "引擎与插件"
    description: "核实截至 2026-11 的 Godot 4 最新稳定版/预览版与维护策略，厘清本项目要用的多人联机底层能力与开销。"
    focus:
      - "最新 stable / rc / beta 版本号与发布日期（线索：Godot 4.7 于 2026-06 发布并带官方资产商店；需核实 4.7.x 补丁版与 4.8 进度）；小版本维护周期与对 GDExtension（GodotSteam）的兼容影响"
      - "SceneMultiplayer：@rpc 各模式（any_peer/authority、call_local、reliable/unreliable/unreliable_ordered、channel）的包头开销与路径缓存；send_bytes / peer_packet 的开销与适用场景；MultiplayerPeerExtension 自定义传输"
      - "MultiplayerSynchronizer / MultiplayerSpawner 的同步机制（每个同步器是否独立发包、delta 同步、visibility 过滤）与带宽/包量特性，核心实体为何不宜挂它"
      - "godot-proposals #7912（换主/改变 server peer）及相关 PR 状态；固定 peer 1 为服务器的含义"
      - "--headless 下 CharacterBody2D、物理、NavigationServer2D、TileMapLayer 的可用性与 CPU；Customize Run Instances 多开与 user:// 数据隔离（是否有 --user-data-dir 之类参数）"
      - "GDScript 在 16 人 × 20Hz 打包/解包与线段碰撞检测下的性能经验"
    prior_claims:
      - "最新稳定版为 Godot 4.7.2-stable（参考报告称 2026-08-18 发布；4.8-beta4 于 2026-11-18 发布）"
      - "godot-proposals #7912 仍未落地（open）"
      - "核心实体不用 MultiplayerSynchronizer，改用原版 ENet/SteamMultiplayerPeer + send_bytes + @rpc 写轻胶水"
      - "无脑挂 MultiplayerSynchronizer 不合包，24 人可达 ~8.3 Mbps / 10,120 PPS"

  - name: "GodotSteam 插件与 SteamMultiplayerPeer 源码"
    category: "引擎与插件"
    description: "核实 GodotSteam 仓库位置、最新版本、安全补丁与 SteamMultiplayerPeer 源码行为，给出版本锁定纪律。"
    focus:
      - "主仓库位置（Codeberg 迁移是否属实、GitHub 是否归档）、GDExtension 与模块版的最新版本号、对应 Steamworks SDK 版本（线索：SDK 1.63/1.64/1.65）、与 Godot 4.x 的兼容矩阵"
      - "2026-11 安全补丁（线索：GodotSteam 博客称 4.24 于 2026-11-07 发布，握手时校验 peer ID、拒绝 <2 或重复 ID、核对 peer 1 的 Steam ID 与房主一致；4.23.2 修 poisoned client）：影响版本、修复版本、PR 号；核实是否存在「CVE-2026-123017」这一编号，查无则写证伪/无法核实"
      - "SteamMultiplayerPeer 源码：create_host 是否固定 peer 1、create_client 的 peer id 分配、丢失 host 时是否调用 close()、走 Networking Messages 还是 Sockets、channel 与可靠性映射、发送缓冲满时的行为"
      - "GodotSteam 暴露的 Networking Sockets/Messages/Utils（sendMessageToConnection、receiveMessagesOnConnection、setConfigValue、getConnectionRealTimeStatus、FakePacketLag/Loss）与 Lobby/Matchmaking/Friends/RemoteStorage 函数和信号，含近一年改名/重构"
      - "与 expressobits/steam-multiplayer-peer 的类注册冲突；GodotSteamKit（线索：1.1.3，要求 SDK 1.65）是什么、是否值得用"
      - "官方教程与示例（lobby、p2p、multiplayer peer）；导出时 steam_api64.dll / libsteam_api.so / steam_appid.txt 放置；版本锁定建议"
    prior_claims:
      - "GodotSteam v4.24-gde 已迁至 Codeberg，修复 4.17–4.23.2 的 CVE-2026-123017 伪造 peer 1 漏洞"
      - "SteamMultiplayerPeer 丢失 peer 1 会触发 close()；create_host() 写死 peer 1、create_client() 随机 peer ID（参考报告）"
      - "2026 年 7–11 月 GodotSteam 发了 8 个独立版本（15 个标签），多含 API 改名（参考报告）"

  - name: "Understudy 源码审计与 Godot 换主生态"
    category: "引擎与插件"
    description: "核实 Understudy（D3）模组的真实情况并审计其源码是否适合本项目；梳理 Godot 生态内其他换主方案与 2025 年换主论文。"
    focus:
      - "发布位置与元数据（线索：store.godotengine.org/asset/ags221/understudy，v0.1.0 unstable，2026-10-08，CC0/MIT-0，Godot 4.5+，纯 GDScript，支持 ENet 与 GodotSteam 传输）、更新记录、实际使用者"
      - "源码审计：输入传输方式（是否 60Hz 不可靠输入流、丢包重复上一帧）、超时参数（如 PLAYER_TIMEOUT_MS）、是否禁用 Godot 物理/CharacterBody2D/@rpc（线索：规则只能经 step() 修改并以字节保存）、影子玩家接管机制与 228ms 中位/276ms 最大的测试条件（线索：单机模拟 40ms/10ms 抖动/1% 丢包）、SDR 连接数、是否做过公网测试"
      - "2025 年换主论文（Louis Vanhove, Howest DAE, zenodo.15169884）的实测环境与结论"
      - "Godot 4 其他换主方案/插件/讨论（社区示例、GD-Sync、W4 Cloud、Nakama 等是否提供换主）"
      - "与本项目 D4（客户端本地算移动、CharacterBody2D）的架构冲突点，以及是否值得借鉴其部分代码"
    prior_claims:
      - "Understudy v0.1.0（unstable）：60Hz 不可靠输入流、2s 踢人超时、禁 Godot 物理、零公网测试，极不适用"
      - "Understudy 发布于 Godot Asset Store（参考报告称 Asset ID 3190，作者 ags221，2026-10-08）"
      - "2025 年论文 1.37–1.53 秒恢复数据是在本机 LAN 用 2 个本地克隆体测得，非公网 Steam SDR 实测（参考报告）"

  # ───────────── Steam 网络基础设施 ─────────────
  - name: "SDR 中继与中国大陆连通性"
    category: "Steam 网络基础设施"
    description: "用一手数据核实中国大陆玩家走 SDR 的实际路径与延迟，并评估直连、加速器等补救手段（全球含大陆玩家的关键风险）。"
    focus:
      - "实际请求 https://api.steampowered.com/ISteamApps/GetSDRConfig/v1/?appid=480（及 2–4 款知名独立联机游戏、CS2 730 作对照）统计 POP 数量与是否含中国大陆 POP；解释 partners 字段与 Steam China/完美世界、阿里云/腾讯云合作节点的现状"
      - "大陆（电信/联通/移动、南北方）→ 香港/东京/新加坡/首尔 POP 的典型 RTT、晚高峰抖动与丢包（实测或社区数据）；大陆↔欧美玩家同房的延迟"
      - "ISteamNetworkingSockets P2P 的 ICE/NAT 穿透直连（k_ESteamNetworkingConfig_P2P_Transport_ICE_Enable 等）默认是否开启、能否让两名大陆玩家直连绕开境外中继；国内 NAT/CGNAT/IPv6/校园网/手机热点下的直连率"
      - "国内加速器（UU、迅游、雷神、Watt Toolkit 等）对使用 SDR 的独立游戏是否有效、是否需要开发者对接"
      - "Steam 在中国大陆的可用性现状（客户端登录、商店/社区访问、下载、支付）对联机与 Lobby 的影响；国内测试者招募渠道"
      - "房主选择：同房混合大陆与海外玩家时，房主所在地对整体手感的影响与建议（如按 ping 选继任者）"
    prior_claims:
      - "GetSDRConfig/v1/ 显示第三方独立游戏获得 0 个中国大陆节点，国内玩家统一经香港/东京/新加坡/首尔 4 个亚太中继转发（晚高峰常见 80–180ms RTT 伴抖动）"
      - "旧完美世界 pw* 节点已退役，CS2/Dota2 改为阿里云/腾讯云大陆节点（ctu/pek/pvg/tgd，partners: 2）（参考报告）"

  - name: "GNS 底层参数：超时、心跳、缓冲、限速与通道"
    category: "Steam 网络基础设施"
    description: "从 Valve GameNetworkingSockets 源码与 Steamworks 文档核实超时、保活、发送缓冲、限速与多通道参数，为心跳、换主与带宽设计提供硬数字。"
    focus:
      - "TimeoutInitial / TimeoutConnected 默认值与源码位置；已建连接在对端崩溃/拔网线时实际多久判定断开（keepalive 间隔、可靠包重传超时如何叠加），有无社区实测"
      - "SendBufferSize 默认值、缓冲满时 SendMessageToConnection 返回 k_EResultLimitExceeded 的条件；SendRateMin/SendRateMax 默认值与对 16 人房主的影响"
      - "Nagle（NagleTime 默认值、k_nSteamNetworkingSend_NoNagle）、单条消息大小上限、MTU/分片、可靠与不可靠消息的包头字节"
      - "Lanes（ConfigureConnectionLanes）能否隔离「移动包 vs 快照包」；ISteamNetworkingMessages（面向 SteamID）与 ISteamNetworkingSockets（面向连接）的取舍"
      - "FakePacketLag / FakePacketLoss / FakePacketReorder / FakePacketJitter 等调试配置在 Steam 环境（含 GodotSteam）的可用性"
      - "getConnectionRealTimeStatus 可取的指标（ping、质量、待发字节）用于游戏内网络面板"
    prior_claims:
      - "GNS 的 TimeoutInitial/TimeoutConnected 默认 10s，但已建连接实际静默断连需 10–21s（空闲链路可达 70s+）（参考报告）"
      - "需自写应用层心跳（1Hz 心跳，4s 冻结 / 7s 失联）"
      - "24 人无脑挂 MultiplayerSynchronizer 会触发 k_EResultLimitExceeded"

  - name: "Steam Lobby：房间列表、房间码、旁观与幽灵房"
    category: "Steam 网络基础设施"
    description: "核实 Steam Matchmaking/Lobby API 的硬限制与行为，设计「单池子房间列表 + 房间码 + 好友邀请 + 激战中可旁观」的大厅方案。"
    focus:
      - "Lobby 成员上限、RequestLobbyList 默认/最大返回条数与 AddRequestLobbyListResultCountFilter、距离过滤（Close/Default/Far/Worldwide）默认值、字符串/数值/近邻过滤及数量限制"
      - "Lobby 元数据键值长度/数量限制、SetLobbyData 频率限制、SetLobbyMemberData；SetLobbyJoinable 与 SetLobbyType 对「激战中房间仍可见」的影响"
      - "Lobby Owner 离开/崩溃时 Steam 自动指定新 Owner 的规则与时延、SetLobbyOwner；LobbyChatUpdate 在拔网线/崩溃时的通知时延（社区实测）；幽灵大厅现象与清理"
      - "好友邀请（InviteUserToLobby、ActivateGameOverlayInviteDialog）、+connect_lobby 启动参数、Rich Presence 的 connect 键、从好友列表加入"
      - "6 位房间码：lobby data 精确过滤 vs 编码 LobbyID；WEBFISHING 1.06/1.08 搜房补丁案例核实"
      - "AppID 480（Spacewar）共享池污染与必加过滤键；协议版本/build_id 写入 lobby data 做加入校验"
      - "旁观者计入成员的方式（max_members = 参战 + 旁观）；中途加入只以人类身份在 Lobby 层的表达"
    prior_claims:
      - "Steam Lobby 拔网线约 15–30s 才通知"
      - "RequestLobbyList 最多返回 50 条；WEBFISHING 1.06（2024-10-12）撞上 50 条上限、1.08（2024-10-17）修复默认距离过滤导致跨区代码房连不上（参考报告）"
      - "两步智能扩圈（防 50 上限与冷启动空房）、满员防隐身 max_members = 参战 + 旁观"

  # ───────────── 动作联机与换主 ─────────────
  - name: "D4 分权移动的动作手感"
    category: "动作联机与换主（核心）"
    description: "判断在 80–180ms 跨境延迟下，「客户端自管移动 + 房主校验命中/感染/穿门」能否给出可接受的动作手感，并给出具体的校验、回溯、插值与开火方式设计。"
    focus:
      - "客户端权威移动在商业 PvP/社交游戏中的先例与边界（Among Us、Fall Guys、Destiny、MMO、Lethal Company 等，哪些用客户端权威移动、出过什么问题）"
      - "房主侧防穿门：prev_pos→new_pos 线段与墙/关门的相交检测、拉回（rubber-band）策略与玩家感知；「人类关门后 150ms 僵尸本地已穿门」的判定归属与表现；避免刚体硬碰撞堵门"
      - "感染/近战判定：favor the shooter / favor the victim 取舍；回溯上限 120–150ms 的业界依据（Source sv_maxunlag、Overwatch、Valorant 等）；拐角/隔空感染的容忍阈值与缓解（如持续接触 X ms、受害者侧确认）"
      - "插值延迟（Source cl_interp 等）与 20Hz 上报/转发的组合；远端实体外推 vs 插值；楼层切换时实体的出现/消失"
      - "命中减速 Tagging（CS 系列 tagging）vs 击退在客户端权威下的冲突与实现（房主下发「减速状态」而非改位置）；低频大击退（霰弹/手雷）如何以位移指令安全下发"
      - "360° 鼠标瞄准 vs 4/8 方向攻击：对命中误差、回溯需求、带宽（朝向字段）、手柄/Steam Deck 适配与「动作轻壳」定位的影响，给出推荐"
      - "15–22 层、每层人少的稀疏遭遇对手感问题的放大或缓解；Godot 4 客户端权威 CharacterBody2D + 服务器校验的实现示例"
    prior_claims:
      - "D4 三大手感坑：① 隔空/拐角感染（房主端 120–150ms 上限历史回溯）；② 人类关门后 150ms 僵尸本地穿门（房主做 prev_pos→new_pos 线段拦截拉回，避免刚体硬碰撞堵门）；③ 高频连发击退抢方向盘鬼畜（改用减速 Tagging）"
      - "Among Us Hide n Seek（15p）是纯 D4 实时追杀先例"

  - name: "全房主权威 + 预测回滚对照（netfox 等）"
    category: "动作联机与换主"
    description: "评估「全房主权威移动 + 客户端预测/回滚」路线（相邻方案 3）在 Godot 4 的成熟度与代价，作为 D4 的对照组。"
    focus:
      - "netfox（foxssake）最新版本、Godot 版本兼容、核心组件（RollbackSynchronizer、TickInterpolator、StateSynchronizer、netfox.noray、netfox.extras 等）、维护活跃度、文档与示例"
      - "netfox 能否跑在 SteamMultiplayerPeer 上、16 人 × CharacterBody2D 的 CPU/带宽经验、已上线 Steam 的使用者"
      - "其他 Godot 4 预测/回滚方案（线索：snopek Godot Rollback Netcode 仅支持到 Godot 4.2、1.0.0-alpha、活跃度低；brogolem35「Godot Rollback With Steam」教程；Multiplayer Starter、GD-Sync）与手写 Source 式预测+和解的工作量"
      - "换主场景下预测回滚方案的额外难度（服务器状态缓冲、tick 对齐）"
