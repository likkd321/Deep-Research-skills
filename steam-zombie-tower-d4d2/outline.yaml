  # ───────────── 市场与执行 ─────────────
  - name: "同类游戏商业与冷启动数据"
    category: "市场与执行（核心）"
    description: "用可查证的数据评估「12–16 人高楼生化买断制 + Bot 兜底」的商业与冷启动存活率。"
    focus:
      - "对标游戏数据（价格、发售日、峰值 CCU、2026-11 当前 CCU、评论数与好评率、估算销量及方法）：Project Zomboid、Barotrauma、Alien Swarm: Reactive Drop、Among Us、WEBFISHING、Liar's Bar、Dale & Dawson Stationery Supplies、Project Winter、Lockdown Protocol、Lethal Company、Content Warning、Dread Hunger、Midnight Ghost Hunt，以及 2024–2026 新出的社交恐怖/感染/撤离联机独立作（可用 SteamDB 标签页逐个取数）"
      - "基准率而非幸存者：个人/小团队小体量联机游戏的峰值与评论数分布；多人游戏 CCU 衰减与冷启动研究（GameDiscoverCo、VG Insights、Gamalytic 等）：平稳期 CCU 占峰值比例、「需 N 人才能开局」的死亡螺旋、Bot/单人模式对留存与评价的影响"
      - "中国玩家在同类游戏中的占比与评论语言分布；国区定价与退款经验"
      - "大房间（10+ 人）买断制联机独立游戏的成败案例对比；「凑人门槛」vs「2–4 人好友开黑」在传播上的差异"
      - "社交传播因子（主播/切片、近距离语音、搞笑时刻）在同类爆款中的作用"
    prior_claims:
      - "GameDiscoverCo（2023）：典型多人游戏平稳期 CCU 通常只剩峰值 ~6%（极佳案例 10–20%）（参考报告）"
      - "Dale & Dawson（$7.99）峰值 6,465，2026-11-24 在线 6 人（参考报告）"
      - "VG Insights：Steam 合作游戏中位销量约为非合作的 8 倍（~40k vs ~5k）（参考报告）"

  - name: "零基础 + 双 AI 协作可行性"
    category: "市场与执行"
    description: "评估零编程基础者全职、主要由 AI 编码完成该联机动作游戏的可行性，提炼协作规范与最易出错的点。"
    focus:
      - "2025–2026 年 AI 编程助手写 GDScript/Godot 4 的能力评估与社区反馈（Godot 3/4 语法混淆、过时 API、GodotSteam 旧 API 幻觉、场景/节点结构理解）"
      - "Godot 专用 AI 工具：Godot MCP 服务器、编辑器内 AI 插件、Claude Code 在 Godot 项目中的工作流（headless 跑测试、截图、读日志）"
      - "零基础/非程序员借助 AI 上架 Steam（尤其联机游戏）的成功与失败案例"
      - "Steam 对 AI 生成内容的披露政策现状（2024-01 规则及其后更新）；Godot 官方/社区对 AI 生成代码的态度"
      - "守护工具：gdtoolkit（gdlint/gdformat）、GUT、gdUnit4、headless CI；适合 AI 的项目结构、CLAUDE.md/AGENTS.md 规范、Windows 本地 ↔ 云端 Linux VM 的同步与版本锁定"
      - "AI 写联机/并发代码最常见的错误模式（竞态、序列化遗漏、peer_id 当主键、在场景树里存状态等）"
    prior_claims: []

  # ───────────── 运维、发行与测试 ─────────────
  - name: "存档、Steam Cloud 与零成本排障日志"
    category: "运维、发行与测试"
    description: "设计本地存档 + Steam Cloud 与零月费的一键排障日志上传方案，核实免费额度与中国大陆可达性。"
    focus:
      - "Steam Cloud：Auto-Cloud 与 ISteamRemoteStorage 的配置、每用户配额（字节/文件数）设置、冲突处理、路径；GodotSteam 的 RemoteStorage 函数"
      - "存档 schema 版本与迁移；成长数据统一接口（日后接 ¥30–60/月小服上报）"
      - "sentry-godot（getsentry/sentry-godot）最新版本与功能（崩溃、日志、附件、GDScript 错误）、Sentry 免费档额度（2026）、sentry.io 在大陆的可达性"
      - "Cloudflare Workers / R2 免费额度与 workers.dev 在大陆的可达性、自定义域名方案；为什么不能裸放 Discord Webhook"
      - "其他 $0 方案（GlitchTip、Backtrace 免费档、Supabase、GitHub Issues API 等）对比"
    prior_claims: []

