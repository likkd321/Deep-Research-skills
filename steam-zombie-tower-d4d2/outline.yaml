      - "心跳与判定：1Hz 心跳、4s 冻结/7s 失联、18s 超时回大厅等参数的合理性；主动退出优雅交接 vs 崩溃/拔网线；错峰重连、按 64 位 steam_id 重建映射"
      - "普通玩家掉线重连、Bot 临时接管掉线者、AFK 处理；无阶段检查点时 D2 失败的降级（A1 + 按即时状态体面结算）"
