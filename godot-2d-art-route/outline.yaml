topic: Godot 2D 3/4 斜俯视角生化感染型 PvP 联机独立游戏的美术路线（单人开发、零美术基础：自制 vs AI 工作流 vs 外购素材）
request: >-
  单人用 Godot 做 2D 俯视生化危机型 PvP 联机游戏（X4-Infection-Strike），零美术基础；想知道大量外购素材的
  2D 俯视精品独立游戏有哪些、自制素材与成败的关系、四条美术路径（全自制 / 定画风+AI 批量生图与骨骼动画 /
  大量外购+填补 / 全外购只精修）的工作流、工具与终局胜率、该用多少像素、Claude 网页版与 Antigravity 各模型能发挥什么、
  社交媒体上 "Carbon 做 Godot 2D 骨骼动画" 帖子是否说明 Gemini 已达到这种能力，以及美术阶段里 AI 能做和必须自己做的部分。
  （第 2 批后追加）游戏是需重复游玩的对抗/搜打撤类，要考虑货架物品显示、人物持不同枪支表现、各像素规格素材供给、修图与动画批量制作难度，
  给出最甜点区、胜率最高、最适合该游戏的最终方案，含全套美术开服流程、工具与工作流。
started_at: "2026-11-26T12:09+08:00"
project_context: &ctx >-
  用户项目 X4-Infection-Strike：Godot 4.7.2 + GDScript，2D 像素 3/4 斜俯视角（对标《远星物语 CrossCode》，带 Y-Sorting），
  10–16 人 + Bot 高楼（8–12 层）生化感染撤离 PvP 联机，Steam 发行；单人开发、零美术基础；
  已初选 WinLu Spaceship Tileset（48×48 px，itch.io 约 $20，3/4 斜俯视科幻包）作为场景底座；
  人物方案倾向「3 面身体（下/上/右，左镜像）+ 360° 独立旋转手与枪」；
  主要 AI 工具：Claude 网页版与 Google Antigravity 客户端，可用除 Fable 外全部模型。

items:
  - name: 美术来源与独立游戏成败关系及基准胜率
    category: 核心判断
    description: >-
      自制美术与独立游戏成败是否显著正相关、是否"非常关乎成败"。需要：Steam 发行量与评论数分布基准（如多少比例游戏评论 >300 / >1000）、
      多人联机独立游戏的冷启动失败率、胶囊图/截图对愿望单与点击率（CTR）的影响数据、"素材翻炒（asset flip）"标签与玩家口碑、
      外购素材成功作与失败作的对比、开发者复盘与 GDC/博客数据（如 Chris Zukowski 等）。给出可量化的判断和置信度。
    project_context: *ctx
  - name: 像素规格与3-4斜俯视角人物方向方案
    category: 核心判断
    description: >-
      8×8 / 16×16 / 32×32 / 48×48 哪个最适合该项目：结合 3/4 斜俯视、16 人同屏可读性、镜头缩放、基准分辨率（如 320×180、480×270、640×360）
      与 1080p/1440p 整数缩放、单人零基础的绘制工作量（每角色方向数×帧数×状态数）、市面素材包在各尺寸的供给量、与已选 WinLu 48×48 的匹配。
      并核实"3 面身体+360° 旋转枪"的成熟做法（Enter the Gungeon、Nuclear Throne、CrossCode 等实际怎么做）及其对联机同步（瞄准角精度、动画状态）的影响。
    project_context: *ctx
  - name: Carbon帖子真伪与Gemini骨骼动画能力核实
    category: 核心判断
    description: >-
      用户在小红书类社交平台看到博主"Mr.梁"的帖子：标题"Carbon好强！做Godot 2D骨骼动画稳了""实测完真的被惊艳到了，Carbon 好强！"，
      截图为「青锋刀客职业【疾风少侠】Godot 4.7 Skeleton2D 骨骼五动作 + 骨骼网格合成预览」：Q 版持大刀少侠的 IDLE 常态待机呼吸 / WALK 稳健行走步态 /
      RUN 疾风提刀奔跑 / ATTACK 破风踏步挥斩 / HURT 受击硬直震退 / RIG 实时骨骼与弹簧链，以及可操作的 Demo（A/D 行走、Shift 奔跑、J 攻击、H 受击、B 骨骼显示、倍速）。
      需查明：「Carbon」到底是什么（Google 新模型代号？Gemini 某版本？其他产品？），它/Gemini 是否真能端到端生成角色图、拆件、绑定 Skeleton2D 并写出动画；
      帖子里哪些部分可能是 AI 做的、哪些需要人工；同类复现案例；这种 Q 版矢量骨骼风格与像素风 3/4 俯视游戏的适配性。给出可信度判断。
    project_context: *ctx
  - name: 独立游戏美术生产阶段拆解与AI覆盖度
    category: 核心判断
    description: >-
      把一款 2D 像素独立游戏的美术生产拆成阶段（美术方向/情绪板、调色板、角色设计、角色动画、tileset 与场景、道具与拾取物、特效 VFX、
      光照与后处理、UI/HUD/图标、字体、宣传素材：胶囊图/预告片/截图），逐阶段评估 2025-11 至今 AI 实际能覆盖多少（可直接用 / 需大量修 / 基本不行），
      哪些必须由开发者本人完成（审美决策、一致性把关、像素清理、可读性测试等），以及"灰盒→占位→替换"的分阶段替换策略。
      【第 1 批跨 item 线索】项目倾向 48px 网格 + 960×540 基准分辨率 + 3 面身体 + 360° 旋转枪；48px 现成人物/僵尸极稀缺，人物大概率需 AI 出底稿 + 人工清理；
      Gemini 4 Carbon（Antigravity 可用）擅长写代码不出图，出图靠 Nano Banana 2.1；胶囊图被多方建议外包（$500–1,000）。
    project_context: *ctx
  - name: 案例库A-2D俯视射击生存僵尸联机类外购素材成功作
    category: 案例
    description: >-
      找 2D 俯视或斜俯视、射击/生存/僵尸/联机类、主体美术大量来自外购或现成素材包（Unity Asset Store、itch.io、CraftPix、LimeZu 等）、
      Steam 评论 >300 的独立游戏；每个案例要有素材来源证据（开发者自述 / 素材作者展示 / 可靠考证）、评论数及抓取日期、引擎。
    project_context: *ctx
  - name: 案例库C-同玩法竞品美术来源与成败
    category: 案例
    description: >-
      与本项目玩法最接近的竞品：感染/僵尸 PvP、非对称"人类 vs 僵尸"、2D 俯视联机生存射击（不限是否外购素材），
      梳理它们的美术来源、像素规格、Steam 评论数与在线人数、成败原因，判断美术在其中的权重。
    project_context: *ctx
  - name: 案例库B-热门像素素材包反查Steam使用作品
    category: 案例
    description: >-
      从热门像素素材包与作者反查使用它们的 Steam 游戏（LimeZu Modern Interiors/Exteriors、Kenney、Pixel Frog、Seliel、CraftPix、Cainos、
      Szadi、Penzilla、ElvGames 等的"Made with"展示页、itch 评论、Steam 页面署名），重点找俯视/斜俯视作品与评论 >300 的作品。
    project_context: *ctx
  - name: 素材推荐清单-生化实验室写字楼僵尸武器特效UI
    category: 资源
    description: >-
      给出适合本项目的具体素材链接：3/4 斜俯视现代写字楼/实验室/生化设施/医院 tileset、僵尸与人类角色（含方向与动画）、枪械与手、
      特效（枪口火光、血、毒气）、UI/HUD/图标、字体；标价格、尺寸（优先 48×48 或可与 48 对齐的 16/32 倍数）、授权（商用、修改、再分发、联机客户端分发）、
      与 WinLu Spaceship Tileset 风格是否搭配（科幻飞船包用于写字楼生化题材是否违和）。
      【第 1 批跨 item 线索】WinLu 包内没有任何人物（作者 23 个包都没有）；itch.io 48x48 标签下人物仅约 30 个、僵尸 0 个，
      48px 现成人物/僵尸极度稀缺；LimeZu Modern Interiors 的 48 档疑似 16px×3 放大（仅一条用户评论，需核实），与 WinLu 原生 48 密度混用可能像素大小不一；
      请重点找可与原生 48px 密度匹配的人物/僵尸来源（含 RPG Maker MV 48px 生态、委托画师、AI 生成后清理）并核实 LimeZu 48 档是否放大。
    project_context: *ctx
  - name: 路径B-定画风加AI批量生图工作流
    category: 路径
    description: >-
      先定画风再用 AI 批量生成像素素材的工作流（2025-11 至今）：像素专用 AI（PixelLab、Retro Diffusion、Sprite-AI、God Mode AI 等）、
      通用图像模型（Gemini 图像模型/Nano Banana 系列、GPT 图像模型、Midjourney、SD/Flux + 像素 LoRA、ComfyUI）、Godot 内 AI 精灵插件；
      角色/画风一致性控制、真像素网格后处理（降采样、调色板量化、去抗锯齿）、商用授权；Steam 2026-01 改版后的 AI 披露规则、玩家对 AI 美术的态度与误判风险。
      【第 2 批后追加】项目是需重复游玩的对抗/搜打撤类：需大量 loot 物品图标与货架/箱子内物品显示、人物持不同枪支的表现、
      多种僵尸/人类变体；请特别评估本路径在 48px 下批量产出这些资产（含修图、动画）的难度、单件成本与一致性。
    project_context: *ctx
  - name: Claude网页版与Antigravity各模型在美术管线中的能力
    category: 路径
    description: >-
      截至 2026-11：Claude 网页版（Opus / Sonnet / Haiku 系列，不含 Fable）与 Google Antigravity 客户端可用模型（Gemini 各版本、Claude、其他）
      在 2D 像素美术管线中各能做什么：图像理解与审图、是否能直接生图、程序化生成（SVG / Python / Aseprite Lua 脚本）、写 Godot 场景/SpriteFrames/Skeleton2D/着色器、
      通过 MCP 驱动 Aseprite / Blender / PixelLab 等工具、批量切图与导入自动化；各自优劣与推荐分工。
      【第 1 批跨 item 线索】已核实「Carbon」即 Google Gemini 4 Carbon（2026-11-10 上线、11-23 起 Antigravity AI Pro 可用、不出图，出图靠 Nano Banana 2.1；
      Gemini 4 Argon 与 3.8 Flash 将于 2026-11-30 退出 Antigravity），请以此口径统一并核对 Antigravity 当前完整模型列表与额度。
    project_context: *ctx
  - name: 2D动画方案-逐帧骨骼3D预渲染AI动画的像素适配
    category: 路径
    description: >-
      2D 角色动画的几条路线：逐帧像素动画、Godot Skeleton2D / Spine / DragonBones 骨骼动画、3D 建模预渲染成像素（如 Dead Cells 做法）、
      AI 动画工具（PixelLab 骨架动画、Retro Diffusion 动画等）；各自与像素风、3/4 俯视、"3 面身体+旋转枪"方案的适配度、工作量、Godot 接入方式。
      【第 2 批后追加】项目是需重复游玩的对抗/搜打撤类：需大量 loot 物品图标与货架/箱子内物品显示、人物持不同枪支的表现、
      多种僵尸/人类变体；请特别评估本路径在 48px 下批量产出这些资产（含修图、动画）的难度、单件成本与一致性。
    project_context: *ctx
  - name: 路径CD-外购主导的工作流与风格统一
    category: 路径
    description: >-
      路径 C（大量自购 + 自己填补）与路径 D（全自购只精修微调）的工作流：如何挑选同一作者/同一系列素材、统一调色板/描边/光照方向/像素密度，
      怎样补画缺失素材、Aseprite 改色与拼装、授权条款陷阱（商用、修改、再分发、AI 训练、署名、付费素材不得进公开仓库）、防素材提取、
      避免被玩家识别为"asset flip"的成熟做法。
      【第 2 批后追加】项目是需重复游玩的对抗/搜打撤类：需大量 loot 物品图标与货架/箱子内物品显示、人物持不同枪支的表现、
      多种僵尸/人类变体；请特别评估本路径在 48px 下批量产出这些资产（含修图、动画）的难度、单件成本与一致性。
    project_context: *ctx
  - name: 路径A-零基础单人全手动自制像素美术
    category: 路径
    description: >-
      零美术基础单人全手动自制像素美术的可行性：工具（Aseprite、Pixelorama、Pyxel Edit、LibreSprite、Krita）、工作流、
      各尺寸下角色/tileset 实际耗时、单人开发者案例（如 Stardew Valley、Eric Barone 等）与零基础转型案例。
      【第 2 批后追加】项目是需重复游玩的对抗/搜打撤类：需大量 loot 物品图标与货架/箱子内物品显示、人物持不同枪支的表现、
      多种僵尸/人类变体；请特别评估本路径在 48px 下批量产出这些资产（含修图、动画）的难度、单件成本与一致性。
    project_context: *ctx
  - name: 零美术基础学习路线
    category: 路径
    description: >-
      面向零美术基础开发者的像素美术学习路线：核心概念（调色板、明暗、可读性、轮廓、抗锯齿、子像素动画、动画 12 原则在像素里的用法）、
      优质教程与作者（Pedro Medeiros/Saint11、Brandon James Greer、AdamCYounis、MortMort、Lospec 等）、练习顺序与 4–12 周时间表、
      "改素材"作为入门方式。
    project_context: *ctx

  - name: 搜打撤对抗类的美术精细度需求与资产规模方案
    category: 核心判断
    description: >-
      项目是需重复游玩的对抗/搜打撤（search-fight-extract）类：调研 2D/2.5D 俯视搜打撤与 loot 型对抗游戏（如 ZERO Sievert、Escape from Duckov、
      Project Zomboid、Dark and Darker 类 2D 化作品、Realm of the Mad God 等）实际的美术精细度与资产规模：loot 物品种类数与图标尺寸、
      货架/箱子内物品是否在世界中逐个显示（还是统一容器图标）、人物持不同枪支的表现方式（独立枪精灵按武器换图 vs 身体动画分武器）、
      僵尸/人类变体数、动画状态数；重复游玩所需的视觉多样性（随机楼层、换色/调色板变体、装饰物组合）如何低成本做出来；
      48px 与 32/16px 下这些资产的现成供给量、AI 批量生成可行性、修图与动画批量制作难度；最后给出本项目 V1.0 的资产清单规模（多少件、多少帧）与最省力的产出组合。
      【前 2 批线索】48px 网格 + 960×540 + 3 面身体 + 360° 旋转枪为倾向方案；48px 现成人物/僵尸极稀缺；PixelLab 能出 48×48 角色 4/8 方向与骨架动画底稿，
      其标准俯视 tileset 只有 16/32px；Retro Dead City（$9.99）有 48 档僵尸。
    project_context: *ctx
execution:
  mode: 标准
  batch_size: 3
  core_items:
    - 美术来源与独立游戏成败关系及基准胜率
    - 像素规格与3-4斜俯视角人物方向方案
    - Carbon帖子真伪与Gemini骨骼动画能力核实
    - 独立游戏美术生产阶段拆解与AI覆盖度
    - 搜打撤对抗类的美术精细度需求与资产规模方案
  items_per_agent: 2
  judgment_items:
    - 美术来源与独立游戏成败关系及基准胜率
    - 像素规格与3-4斜俯视角人物方向方案
    - Carbon帖子真伪与Gemini骨骼动画能力核实
    - 独立游戏美术生产阶段拆解与AI覆盖度
    - 搜打撤对抗类的美术精细度需求与资产规模方案
  agent_groups:
    - {agent: web-search-agent-deep, model: opus, items: [美术来源与独立游戏成败关系及基准胜率]}
    - {agent: web-search-agent-deep, model: opus, items: [像素规格与3-4斜俯视角人物方向方案]}
    - {agent: web-search-agent-deep, model: opus, items: [Carbon帖子真伪与Gemini骨骼动画能力核实]}
    - {agent: web-search-agent-deep, model: opus, items: [独立游戏美术生产阶段拆解与AI覆盖度]}
    - {agent: web-search-agent, model: sonnet, items: [案例库A-2D俯视射击生存僵尸联机类外购素材成功作, 案例库C-同玩法竞品美术来源与成败]}
    - {agent: web-search-agent, model: sonnet, items: [案例库B-热门像素素材包反查Steam使用作品, 素材推荐清单-生化实验室写字楼僵尸武器特效UI]}
    - {agent: web-search-agent, model: sonnet, items: [路径B-定画风加AI批量生图工作流, Claude网页版与Antigravity各模型在美术管线中的能力]}
    - {agent: web-search-agent, model: sonnet, items: [2D动画方案-逐帧骨骼3D预渲染AI动画的像素适配, 路径CD-外购主导的工作流与风格统一]}
    - {agent: web-search-agent, model: sonnet, items: [路径A-零基础单人全手动自制像素美术, 零美术基础学习路线]}
    - {agent: web-search-agent-deep, model: opus, items: [搜打撤对抗类的美术精细度需求与资产规模方案]}
  output_dir: ./results
