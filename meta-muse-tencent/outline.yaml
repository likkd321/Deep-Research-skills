      ②组织与决策：2025–2026年AI组织调整、赛马机制、马化腾"不搞AI全家桶、坚持去中心化"；关键决策速度（如小微从曝光到灰度的时间）；
      ③打分：对A1–A5、B1–B5逐维度给分、理由、关键证据（引用本研究各项事实与score_inputs），同时给Meta、阿里、字节的参照分；计算加权分：应用适配度（/50）、落实能力（/50）、总分（/100）；
      ④敏感性分析：哪些变化会让总分变动5分以上（如小微全量并打通支付、混元进入第一梯队、监管收紧AI代付、阿里/字节与微信互通）；
      ⑤结论：腾讯最强项与最短板各一句话、整体置信度；明确标注为主观判断。

  - id: 12
    name: Agent交易协议与支付轨道
    part: 问题一与问题二（交易分成能否跑通的"轨道之争"）
    background_files:
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/小微与微信Agent.json
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/MetaMuse类比.json
    description: |
      为什么单列：据报道扎克伯格在9/23 Connect上首次明确"从交易中抽成"是Muse变现核心（Runtime报道，待核实）；交易分成能否跑通，取决于谁掌握交易与支付的"轨道"。
      研究要点：
      ①Muse商业网络：已接入的伙伴（Shopify/Shop Pay、PayPal含Mastercard Agent Pay、Stripe/Link、Expedia、Instacart等；第二步线索，待核实）、合作条款、抽成对象（商户还是用户）与比例、上线时间；
      ②美国协议阵营：OpenAI/Stripe的Agentic Commerce Protocol（据称4%交易费）与Instant Checkout（据称2026-03因商户寥寥下线、转向"发现"，待核实）；Google/Shopify的Universal Commerce Protocol（20+伙伴，支持Nike/Target/Walmart/Wayfair等结账，待核实）；Google AP2；Visa Intelligent Commerce、Mastercard Agent Pay；各协议的费率、商户覆盖、交易规模、存活状态；
      ③商户侧经济：零售商对Agent渠道的态度（担心失去客户关系与广告收入，如亚马逊）、联盟佣金/CPS费率作为抽成上限参照（亚马逊联盟、旅行OTA佣金）、Agent带来的转化率/客单价数据；
      ④中国协议与轨道：支付宝ACT协议（2026-01-16，联合千问App、淘宝闪购）与AI付交易数据；微信AI专属卡（资金隔离、限额、逐笔确认）与小程序AI接入框架中的交易环节；华为支付接入小艺；网联/银联相关安排；中国第三方支付费率（约0.38%–0.6%）与小程序技术服务费作为抽成参照；
      ⑤对比结论：美国"Agent平台不掌握支付、需与商户和支付方谈判"vs 中国"超级App自有支付与服务生态"——交易分成在哪边更容易跑通、谁拿走多少价值；对Muse与腾讯各自的含义。

execution:
  mode: 标准           # 检索类item用sonnet（web-search-agent），需大量深度判断的item用opus（web-search-agent-deep）
  batch_size: 2        # 最大并行子agent数；用户要求每批两个都回来、验证、存档后询问是否继续
  core_items:          # 重点核心item，各自单独一个子agent
    - Muse单位经济
    - Muse变现路径与可行性
    - Meta与腾讯禀赋对照
    - 中国版Muse形态与腾讯路线
    - 腾讯执行记录与落实能力评分
  items_per_agent: 2   # 非核心item每个子agent负责2个（item 12为第二步新增，与同源的item 4成组；item 9单独成组）
  judgment_items:      # 需要大量深度判断：派 web-search-agent-deep（effort high），标准模式下用opus
    - Muse单位经济
    - Muse变现路径与可行性
    - Meta与腾讯禀赋对照
    - 中国版Muse形态与腾讯路线
    - 腾讯执行记录与落实能力评分
  agent_groups:        # 按派发顺序排列：用户要求第1批先跑两个sonnet组、第2批放两个opus组；判断组排在它依赖的检索组之后，评分组最后
    - {agent: web-search-agent, model: sonnet, items: [Muse产品定价与早期数据, Muse外部阻力与监管]}               # 第1批（已完成）
    - {agent: web-search-agent, model: sonnet, items: [腾讯Agent落地现状, 中国个人Agent竞争格局]}                 # 第1批（已完成）
    - {agent: web-search-agent-deep, model: opus, items: [Meta与腾讯禀赋对照]}                                    # 第2批
    - {agent: web-search-agent-deep, model: opus, items: [Muse单位经济]}                                          # 第2批
    - {agent: web-search-agent-deep, model: opus, items: [中国版Muse形态与腾讯路线]}                              # 第2批补位（禀赋对照完成后，用户要求再放一个opus）
    - {agent: web-search-agent, model: sonnet, items: [海外个人Agent竞品与变现基准, Agent交易协议与支付轨道]}     # 第3批
    - {agent: web-search-agent, model: sonnet, items: [中国监管与合规约束]}                                        # 第3批
    - {agent: web-search-agent-deep, model: opus, items: [Muse变现路径与可行性]}                                  # 第4批（需单位经济、海外竞品、交易协议完成后）
    - {agent: web-search-agent-deep, model: opus, items: [腾讯执行记录与落实能力评分]}                            # 第5批
  output_dir: meta-muse-tencent/results   # 相对仓库根目录
