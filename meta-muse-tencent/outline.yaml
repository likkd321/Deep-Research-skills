items:
  - id: 1
    name: Muse产品定价与早期数据
    part: 问题一（Muse商业模式）
    background_files:
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/MetaMuse类比.json
    description: |
      已核实（沿用上一研究，不必重查）：2026-09-08美国上线；入口iOS/Android/muse.ai/WhatsApp，9/17 Mac、9/18加拿大；免费档+Power 20美元/月+Max 100美元/月；Muse Secure VM+Sentinel哨兵代理+Stripe Link一次性卡号，预告Confidential VM；Sensor Tower 13天全球下载超250万、Apptopia 12天美加约280万/美国移动端日活约64.2万、Appfigures前11天净收入约2.7万美元；超95%用户同为Facebook用户、63%为Instagram用户；Meta至少投放53条推广广告。
      研究要点：
      ①能力边界：能做/不能做的任务（购物、订票、订餐、邮件、日程、表单、比价、后台长任务），可连接的账户与数据（WhatsApp/Facebook/Instagram收藏与私信、邮箱、日历、第三方网站），媒体实测与第三方评测的任务成功率；与Meta AI（聊天助手）的关系与分工；
      ②技术与团队渊源：Muse Spark/Muse Spark 1.1；Meta是否于2025年底收购Manus（据报道）、Muse与Manus在技术和团队上的关系（第二步线索，待核实）；
      ③定价细节：免费档用量上限（任务数/Token/虚拟机时长；InfoQ"约1亿Token/周"口径待核实）、Power与Max的差异（算力、并发、任务时长、优先级）、年付/家庭/企业版、是否计划广告支持的免费版；
      ④9/23 Meta Connect新发布（第二步线索，待核实）：Muse新增实时视频通话、自定义语音、专属邮箱地址、Mac控制等；Muse Charm挂坠（价格、上市时间）；Ray-Ban Meta Audio、Ray-Ban Meta Gen 3、VR Glasses等新硬件的价格与时间；硬件与Muse的绑定方式；
      ⑤9/22之后的最新数据：累计下载、App Store排名走势、DAU/MAU、留存（D1/D7/D30如有）、付费转化与收入估算更新（Appfigures/Sensor Tower/Apptopia）；Meta官方是否披露用户数；用户评分与评论主题；
      ⑥信任与采用摩擦：用户调查（如"仅8%受访者愿意向Meta共享密码"，第二步线索，待核实）、隐私顾虑对授权深度的影响；
      ⑦使用场景分布（第三方调查或官方案例）与扩张路线（下一批国家/地区、语言、Windows/网页端）。

  - id: 2
    name: Muse单位经济
    part: 问题一（Muse商业模式）
    background_files:
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/MetaMuse类比.json
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/财务资本开支与估值.json
      - /home/user/Deep-Research-skills/meta-muse-tencent/results/ 下本研究已完成的JSON（派发时已有：Muse产品定价与早期数据（含各档Token额度）、Muse外部阻力与监管、腾讯Agent落地现状、中国个人Agent竞争格局；海外个人Agent竞品与变现基准、Agent交易协议与支付轨道尚未完成，所需对照数据请自行检索）
    description: |
      研究要点：
      ①成本拆解：单次任务的推理Token量（计算机操作类Agent的截图/DOM输入与多步规划）、Muse Spark推理成本（无披露时以同级模型API价格或公开推理成本研究作代理）、Secure VM的算力/内存/存储/带宽成本（按云厂商同规格实例价格×任务时长估算）、Sentinel审核开销、支付与身份等第三方费用、客服与风控；
      ②分档测算：按典型用户画像测算免费/Power/Max用户的月成本区间与毛利；免费档用量上限对应的最大补贴；
      ③对照：ChatGPT Plus/Pro的推理成本与毛利报道（含Pro档亏损报道）、ChatGPT Agent/Operator单任务成本、Manus积分定价与单任务成本、云浏览器/沙箱服务（Browserbase、E2B等）价格；
      ④Meta的承受力：2026年资本开支指引（1300–1450亿美元口径需核最新）、折旧增长、FoA经营利润率、Reality Labs亏损；Muse算力占用的量级；管理层对Muse/Meta AI成本与ROI的表述；
      ⑤盈亏平衡：在成本假设下需要多高的付费率、ARPU、交易分成或广告增量才能覆盖免费档补贴；敏感性（推理成本年降幅、VM复用/休眠、端侧推理）；
      ⑥对腾讯的映射：小程序/MCP结构化调用 vs 虚拟机操作网页的成本差（Token、延迟、成功率），中国算力价格与芯片约束，腾讯做同类Agent的单位成本高低与可承受补贴（结合腾讯资本开支与新AI产品亏损）。

  - id: 3
    name: Muse变现路径与可行性
    part: 问题一（Muse商业模式）
    background_files:
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/MetaMuse类比.json
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/腾讯生态AI变现证据.json
      - /home/user/Deep-Research-skills/meta-muse-tencent/results/ 下本研究已完成的JSON（派发时应已有：Muse产品定价与早期数据、Muse单位经济、海外个人Agent竞品与变现基准、Agent交易协议与支付轨道、Muse外部阻力与监管）
    description: |
      研究要点：
      ①订阅：付费转化与ARPU的现实区间（早期数据+ChatGPT基准），年化订阅收入量级及占Meta收入比例；Oppenheimer"约1.15亿付费用户×20美元/月≈275–280亿美元年化"的门槛测算与其怀疑理由（第二步线索，待核实）；
      ②交易分成：扎克伯格在9/23 Connect上"从交易中抽成"的原话与机制细节（Runtime报道，待核实）、Muse商业网络伙伴与费率、可服务GMV（亚马逊封禁后的缺口）、潜在收入测算；与ACP/UCP的费率和存活情况对照；
      ③广告：Meta自2025-12-16起用Meta AI对话信号个性化广告的政策（待核实）是否覆盖Muse、Muse任务意图如何进入广告系统；Muse内赞助推荐/付费排名的可能；AI广告系统（Advantage+、Andromeda、GEM等）已带来的转化提升数据；意图数据价值测算；
      ④WhatsApp商业化：商家Business AI（每周100万+商家使用）、点击消息广告、付费消息（FoA其他收入约10亿美元/季、+73%）——Muse作为用户侧Agent与商家侧Agent对接的可能与收入含义；
      ⑤硬件：Connect新眼镜与Muse Charm的定价、销量预期、与Muse订阅的捆绑；
      ⑥战略意图与间接价值：防守OpenAI/Google占据个人助理入口、提升时长与留存、数据飞轮；Meta管理层（扎克伯格、Susan Li、Alexandr Wang等）关于Muse变现的原话（2026年Q2电话会、Connect、采访）；
      ⑦市场定价：9/21以来卖方对Muse收入的预测（2027/2028）、目标价调整理由、约1920亿美元市值增量的拆解；多空分歧（Oppenheimer看空理由 vs 摩根大通、富国银行等看多理由）；中文媒体观点（21世纪经济报道《别急着找"中国版Muse"》、虎嗅《拆解Muse叙事："新入口"逻辑并不成立》）；
      ⑧综合判断：各路径判定（已跑通/有望/存疑/难）、时间表与前提；乐观/基准/悲观三情景（用户、付费率、ARPU、GMV、抽成、广告增量→收入与利润贡献），结合单位经济结果给出"何时、以何种组合跑通"的结论。

  - id: 4
    name: 海外个人Agent竞品与变现基准
    part: 问题一（Muse商业模式的对照组）
    background_files:
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/MetaMuse类比.json
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/小微与微信Agent.json
    description: |
      研究要点（2025年至今，尽量给可比数字；交易协议细节归item 12，此处只记各家产品层面）：
      ①OpenAI：ChatGPT周活/月活、付费订阅数与付费率、Go/Plus/Pro价格与ARPU、收入与亏损；ChatGPT Agent（原Operator）的能力、使用量与限额；ChatGPT广告（是否上线、形式、收入预期）；OpenAI消费硬件进展；
      ②Google：Gemini App月活、Gemini Agent/Project Mariner/Chrome内Agent、AI Pro/Ultra订阅价格与用户数、AI Mode广告；
      ③Amazon：Alexa+（定价、Prime捆绑、用户数）、Buy for Me、Rufus（对GMV与广告的贡献）；
      ④Apple：新版Siri（与Gemini合作）、App Intents、上线时间；
      ⑤Perplexity（Comet、Pro/Max订阅、购物功能、收入）、Microsoft Copilot消费者版（Copilot Actions）、Anthropic Claude消费者产品（Claude for Chrome等）、xAI Grok、Manus等；
      ⑥汇总"变现基准表"：各家订阅价格、付费率、ARPU、交易抽成、广告化进度、对平台封锁的态度，并标出哪些数字可用来推断Muse的天花板（例如Muse达到ChatGPT的付费率意味着多少订阅收入）。

  - id: 5
    name: Muse外部阻力与监管
    part: 问题一（Muse变现的外部约束）
    background_files:
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/MetaMuse类比.json
    description: |
      已核实（沿用）：亚马逊9/20起封禁Muse；Inc.记者称其擅读私信；TechCrunch质疑信任；Instagram私信2026-05取消端到端加密。
      研究要点：
      ①平台封锁：亚马逊封禁的方式（技术屏蔽/服务条款/法律函）、理由（Muse不表明AI身份、疑似截留登录凭证等）与Meta回应；亚马逊2026-08-14更新使用条款要求Agent在User-Agent中表明身份、9/21起对Muse执法，以及"标准对自家购物Agent不适用"的双重标准争议（第二步线索，待核实）；Forbes《亚马逊封禁Muse的680亿美元理由》（广告收入）的论证；其他平台（沃尔玛、eBay、Shopify商户、Expedia/Booking、航司、银行、Uber/DoorDash、Ticketmaster）是合作、放行还是屏蔽；Cloudflare等对AI Agent流量的识别、签名与收费机制；
      ②法律先例：Amazon v. Perplexity（Comet）案——2026-08-04上诉法院裁定"是Comet用户而非Perplexity访问亚马逊"（第二步线索，待核实）的要点及对CFAA/服务条款执法的影响；对Muse的法律风险外溢；
      ③Meta自己也是守门人：欧盟委员会就WhatsApp禁止第三方AI助手采取临时措施（IP/26/1276，待核实）——Meta一边被亚马逊封、一边封别人，对"开放网页Agent"逻辑的含义；
      ④安全：Muse Mac客户端本地零日漏洞（Patrick Wardle披露，配置项可被篡改以劫持听写流量）与修复情况；Meta漏洞赏金（提示注入最高13万美元、严重漏洞最高30万美元，待核实）；提示注入/恶意网页攻击Agent的公开案例；误购与退款责任、Meta的赔付政策；Sentinel/Confidential VM的第三方评估；
      ⑤隐私与信任：Muse读取WhatsApp/Instagram私信的范围与授权方式、用户信任度调查；Meta历史隐私处罚与FTC 2020同意令对Muse的约束；
      ⑥美国监管：FTC、CFPB对AI Agent与代理支付的表态，各州隐私/AI法（加州CCPA自动化决策规则、科罗拉多AI法等）；
      ⑦欧盟与其他：Muse未进欧盟的原因（DMA、GDPR、AI法案、Meta AI在欧盟延迟上线的前例），进英国/印度/巴西等市场的障碍；
      ⑧结论：上述阻力对订阅、交易分成、广告三条变现路径的影响程度排序。

  - id: 6
    name: Meta与腾讯禀赋对照
    part: 问题二（Muse逻辑能否迁移到腾讯）
    background_files:
      - /tmp/claude-0/-home-user-Deep-Research-skills/5bf80f54-c3e3-528d-b83e-30267eac3a7b/scratchpad/prev/tencent-dilemma-factcheck/results/MetaMuse类比.json
