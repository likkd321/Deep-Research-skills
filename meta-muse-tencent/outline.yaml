      ③个人信息与数据：《个人信息保护法》对敏感个人信息、单独同意、委托处理、自动化决策的要求；读取聊天记录/通讯录/屏幕内容用于Agent的合规边界；《网络数据安全管理条例》（2025-01-01）；相关执法案例；
      ④生成式AI与算法：《生成式人工智能服务管理暂行办法》备案、《人工智能生成合成内容标识办法》（2025-09-01）、算法备案；
      ⑤平台互联互通与竞争法：超级App封堵第三方Agent（豆包手机助手事件）是否违反《反垄断法》《反不正当竞争法》（2025年修订的数据/技术干扰条款），监管或法院的态度与判例；
      ⑥民事责任：Agent代为下单/付款出错的责任分配（《民法典》代理规则、消费者权益保护法、电子商务法）；
