</style></head><body><div class="wrap"><header class="mhead"><div><p class="muted" style="margin:0">Godot + Claude 做 Steam 联机 2D 游戏</p><h1>24 种情况速览（手机版）</h1></div><button id="theme" type="button">☾ 深色</button></header><p class="muted">四个条件各选一项，点“确认”看这一格的速览：难不难、难在哪、要注意什么。</p><form id="picker" class="picker" onsubmit="return false"><div class="xrow"><label class="xcell"><span class="xhead">A（对战模式）</span><select name="mode" aria-label="A（对战模式）"><option value="" selected>请选择</option><option value="PVE">PVE（合作打电脑）</option><option value="PVP">PVP（玩家对战）</option></select></label><label class="xcell"><span class="xhead">B（延迟需求）</span><select name="lat" aria-label="B（延迟需求）"><option value="" selected>请选择</option><option value="帧不敏感">帧不敏感（三国志式）</option><option value="帧敏感">帧敏感（马里奥式）</option></select></label><label class="xcell"><span class="xhead">C（房主离开时）</span><select name="mig" aria-label="C（房主离开时）"><option value="" selected>请选择</option><option value="0">不换主（散局回大厅）</option><option value="1">秒级换主（停几秒换人）</option><option value="2">无感换主（几乎无感）</option></select></label><label class="xcell"><span class="xhead">D（每局人数）</span><select name="n" aria-label="D（每局人数）"><option value="" selected>请选择</option><option value="0">4–6 人（小队）</option><option value="1">7–12 人（中等规模）</option></select></label><div class="xcell xbtn"><span class="xhead">&nbsp;</span><button id="confirm" type="button" disabled>确认</button></div></div><p id="pickhint" class="muted">还需选择 4 项条件</p></form><div id="detail" class="detail" aria-live="polite"></div><template id="t1"><div class="dhead"><span class="cid">#1</span><b>PVE × 帧不敏感 × 不换主 × 4–6 人</b><span class="badge st-good"><span class="bi" aria-hidden="true">★</span>首推</span></div><p class="dnote">24 格里唯一一个“高置信可行 + 上线后基本不用管”的组合，首款游戏的最佳落点。</p><div class="kv"><div class="m t-good"><span class="ml">实现难度</span><span class="score" title="2/5">2<small>/5</small></span><em class="mw">容易</em></div><div class="m t-good"><span class="ml">Claude 把握</span><span class="score" title="4/5">4<small>/5</small></span><em class="mw">高</em></div><div class="m t-good"><span class="ml">网络稳定</span><span class="score" title="4/5">4<small>/5</small></span><em class="mw">稳</em></div><div class="m t-good"><span class="ml">网络部分工期</span><b class="mv">2.5–4.5 周</b><em class="mw">短</em></div><div class="m t-good"><span class="ml">终局胜率（主观）</span><b class="mv">80–85%</b><em class="mw">较高</em></div></div><p class="kvleg muted"><i class="k t-good"></i>好 <i class="k t-warn"></i>一般 <i class="k t-bad"></i>差（难度、工期越低越好；其余越高越好）</p><div class="ov"><div class="ovc hero"><div class="ovh">🎮 这格是什么样的游戏</div><p>大家一起打电脑的策略/回合/卡牌/塔防类：比如几个人合力守城、一起打牌闯关。节奏慢，比的是脑子不是手速。</p><p>一局 4–6 人，一个小队的规模。房主一走，这局就结束，大家回大厅（进度不丢）。</p><div class="diffline t-good"><span class="st">★★☆☆☆</span><b>整体难度 2/5 · 轻松</b><span class="muted">（终局胜率约 80–85%，网络部分约 2.5–4.5 周）</span></div></div><div class="ovc"><div class="ovh">🛠 推荐怎么做</div><p class="analogy">像网上下棋：只有房主手里那盘是“正式棋盘”。大家把要走的棋告诉房主，房主落子后通知所有人；每人手里还有一份棋盘抄本，随时能对上。</p><p class="tech"><b>技术上一句话：</b>房主权威 + 指令/状态同步（每秒 5–10 次，全员持有完整状态副本）；房主离开 → 全员体面回大厅，本地成长已存档不丢（全景表 A1）</p></div><div class="ovc"><div class="ovh">👀 玩家会感受到什么</div><dl class="feel"><dt>操作手感</dt><dd>延迟 100–200ms 也基本感觉不到，全球玩家一起玩都没问题。</dd><dt>房主离开时</dt><dd>弹出“房主已离开”，回到大厅；这局的经验奖励已经存好，想继续就重新开一局。</dd><dt>进房方式</dt><dd>房间列表里能看到全球等待中的房间，也能输房间码或直接接受 Steam 好友邀请。</dd></dl></div><div class="ovc wide"><div class="ovh">📊 难度拆解：难在哪、不难在哪</div><div class="bk"><div class="bkn">大厅与房间列表</div><div class="bkbar"><i class="t-good" style="width:30%"></i></div><div class="bkw t-good">轻松</div><div class="bkt">Steam 自带房间列表、邀请和房间码，Claude 很熟，约 1 周搞定。</div></div><div class="bk"><div class="bkn">同步</div><div class="bkbar"><i class="t-good" style="width:30%"></i></div><div class="bkw t-good">轻松</div><div class="bkt">只传“指令”和结果，像传纸条，最简单。</div></div><div class="bk"><div class="bkn">房主离开</div><div class="bkbar"><i class="t-good" style="width:30%"></i></div><div class="bkw t-good">轻松</div><div class="bkt">只要做到体面散场、进度不丢，很简单。</div></div><div class="bk"><div class="bkn">人数</div><div class="bkbar"><i class="t-good" style="width:30%"></i></div><div class="bkw t-good">轻松</div><div class="bkt">小队规模，带宽和掉线压力都小。</div></div><div class="bk"><div class="bkn">对抗与凑人</div><div class="bkbar"><i class="t-good" style="width:30%"></i></div><div class="bkw t-good">轻松</div><div class="bkt">合作玩家很宽容，也不用凑对手。</div></div><div class="bk"><div class="bkn">测试与上线维护</div><div class="bkbar"><i class="t-good" style="width:40%"></i></div><div class="bkw t-good">轻松</div><div class="bkt">要两台电脑真机测试，上线头几周一定会修网络 bug。</div></div></div><div class="ovc pros"><div class="ovh">👍 好处</div><ul><li>不用租服务器，每月成本 0 元；上线后也不会因为“服务器出事”而停服。</li><li>网络要求很低：普通家用宽带绰绰有余，全球玩家一起玩也基本没延迟问题。</li><li>最省事：房主离开只要体面散场，这正是 Claude 最拿手的代码。</li><li>最容易凑满房，同类游戏的先例也最多。</li><li>零服务器、零月租</li><li>带宽极小（6 人房主上行约 0.1 Mbps）</li><li>Claude 最拿手的一类代码</li><li>PVE 玩家对“房主走了就散”容忍度高（致命公司、深岩银河、Peak 都这么做）</li></ul></div><div class="ovc cons"><div class="ovh">⚠️ 坑和代价</div><ul><li>只有 Steam 玩家能联机；上线头几周到几个月一定要修网络 bug（同类 Godot 游戏都经历过）。</li><li>房主一掉线整局就结束，所以单局最好控制在 15–30 分钟以内。</li><li>房主掉线整局结束</li><li>需要把单局控制在 15–30 分钟以内，散局损失才可接受</li></ul></div><div class="ovc"><div class="ovh">🤖 Claude 能帮你写的（把握度 4/5）</div><ul><li>Steam 大厅、房间列表、邀请、房间码这些“标准件”。</li><li>房主说了算的基础同步和 RPC 调用。</li><li>房主离开时体面回大厅、写本地存档。</li></ul></div><div class="ovc"><div class="ovh">🙋 你自己要扛的</div><ul><li>定下“每样东西由谁说了算”，写成文档让 Claude 照着写。</li><li>用两台电脑做真机测试，学会看联机日志找问题。</li><li>锁定 Godot 和 GodotSteam 的版本，把对应版本的文档喂给 Claude。</li></ul></div><div class="ovc"><div class="ovh">✅ 必做清单</div><ul class="chk"><li>强制走 Steam 中继，大厅搜索设为“全球”，用版本号过滤房间。</li><li>房主一走就体面回大厅，经验奖励提前存好。</li><li>游戏单人也要完整可玩，联机出问题时还有退路。</li></ul></div><div class="ovc"><div class="ovh">🪂 退路</div><p><b>备选方案：</b>想更省事：回合/指令制直接每回合广播全量状态</p><ol class="fb"><li>联机整体不顺 → 先保证单人可玩，用 Steam 远程同乐（最多 4 人、只需房主有游戏）兜底</li></ol></div><div class="ovc wide adv"><div class="ovh">💡 如果我是你</div><p><b>放心做。这是首款游戏最稳的落点，照着必做清单走就行。</b> </p><p class="muted">一句话结论：24 格里唯一一个“高置信可行 + 上线后基本不用管”的组合，首款游戏的最佳落点。</p>< ss="ovc"><div class="ovh">🪂 退路</div><p><b>备选方案：</b>降为 D2 或不换主</p><ol class="fb"><li>无感换主做不稳 → 改成秒级换主（停几秒并提示）</li><li>秒级换主也不稳 → 改成“房主走就体面散场”</li><li>人多卡顿 → 上限降到 8 人</li><li>联机整体不顺 → 先保证单人可玩，用 Steam 远程同乐（最多 4 人、只需房主有游戏）兜底</li></ol></div><div class="ovc wide adv"><div class="ovh">💡 如果我是你</div><p><b>不建议用第一款游戏碰这一格。如果玩法允许，建议改成下面这个更好做的组合。</b> 只改一个条件的话，推荐 #8（PVE × 帧敏感 × 不换主 × 7–12 人，结论“勉强”，难度 3.5/5、胜率 45–55%）。想要稳妥的话，离这格最近的“可行”组合是 #2（PVE × 帧不敏感 × 不换主 × 7–12 人，结论“可行”，难度 2/5、胜率 70–75%），要改 2 个条件。</p><p class="muted">一句话结论：不建议。</p></div></div></template><template id="t13"><div class="dhead"><span class="cid">#13</span><b>PVP × 帧不敏感 × 不换主 × 4–6 人</b><span class="badge st-good"><span class="bi" aria-hidden="true">✓</span>可行</span></div><p class="dnote">技术稳，市场靠“好友派对 + 单人内容兜底”。建议同时做 #15 的优雅交接。</p><div class="kv"><div class="m t-good"><span class="ml">实现难度</span><span class="score" title="2/5">2<small>/5</small></span><em class="mw">容易</em></div><div class="m t-good"><span class="ml">Claude 把握</span><span class="score" title="4/5">4<small>/5</small></span><em class="mw">高</em></div><div class="m t-good"><span class="ml">网络稳定</span><span class="score" title="4/5">4<small>/5</small></span><em class="mw">稳</em></div><div class="m t-good"><span class="ml">网络部分工期</span><b class="mv">3–5.5 周</b><em class="mw">短</em></div><div class="m t-good"><span class="ml">终局胜率（主观）</span><b class="mv">70–80%（技术）</b><em class="mw">较高</em></div></div><p class="kvleg muted"><i class="k t-good"></i>好 <i class="k t-warn"></i>一般 <i class="k t-bad"></i>差（难度、工期越低越好；其余越高越好）</p><div class="ov"><div class="ovc hero"><div class="ovh">🎮 这格是什么样的游戏</div><p>玩家互相较劲的回合/心理战/派对类：比如骗子酒馆、狼人杀、卡牌对战。拼的是策略和演技，不拼反应。</p><p>一局 4–6 人，一个小队的规模。房主一走，这局就结束，大家回大厅（进度不丢）。</p><div class="diffline t-good"><span class="st">★★☆☆☆</span><b>整体难度 2/5 · 轻松</b><span class="muted">（终局胜率约 70–80%（技术），网络部分约 3–5.5 周）</span></div></div><div class="ovc"><div class="ovh">🛠 推荐怎么做</div><p class="analogy">像网上下棋：只有房主手里那盘是“正式棋盘”。大家把要走的棋告诉房主，房主落子后通知所有人；每人手里还有一份棋 de 写得出来。</li><li>房主走了不散局，玩家体验比“直接散场”好很多。</li><li>人多热闹，适合派对、社交类玩法。</li><li>实现比局内实时恢复简单</li></ul></div><div class="ovc cons"><div class="ovh">⚠️ 坑和代价</div><ul><li>只有 Steam 玩家能联机；上线头几周到几个月一定要修网络 bug（同类 Godot 游戏都经历过）。</li><li>要从第一天起按“可存档”的方式写代码；做得半成功的换主（回档、丢东西、卡住）比直接散场更招骂。</li><li>手感和带宽都要调；房主网络差会卡全场，要引导网最好的人当房主。</li><li>房主有天然的延迟优势，命中判定容易起争议；还要凑齐对手、按地区组房。</li><li>凑满 7–12 个同时在线的人很难；人多也更容易有人掉线（每局约 31%）。</li><li>叠加 #20 的全部问题</li></ul></div><div class="ovc"><div class="ovh">🤖 Claude 能帮你写的（把握度 1.5/5）</div><ul><li>Steam 大厅、房间列表、邀请、房间码这些“标准件”。</li><li>房主说了算的基础同步和 RPC 调用。</li><li>房主离开时体面回大厅、写本地存档。</li><li>插值、客户端自己算移动这类常见写法（手感要你来调）。</li><li>快照存取、换主流程的骨架代码（对不对要你真机验证）。</li></ul></div><div class="ovc"><div class="ovh">🙋 你自己要扛的</div><ul><li>定下“每样东西由谁说了算”，写成文档让 Claude 照着写。</li><li>用两台电脑做真机测试，学会看联机日志找问题。</li><li>锁定 Godot 和 GodotSteam 的版本，把对应版本的文档喂给 Claude。</li><li>亲自试玩调手感：插值多长、延迟多少能接受。</li><li>反复做故障测试，判断换主到底可不可靠，敢不敢上线。</li><li>定规则：怒退、掉线、命中判定怎么算，并在游戏里讲清楚。</li><li>找人做 7–12 人的大人数测试（凑不齐可用无界面客户端模拟）。</li></ul></div><div class="ovc"><div class="ovh">✅ 必做清单</div><ul class="chk"><li>强制走 Steam 中继，大厅搜索设为“全球”，用版本号过滤房间。</li><li>房主一走就体面回大厅，经验奖励提前存好。</li><li>从第一天起：所有状态都能存档、每个物体有固定编号、不把状态藏在物理和动画里。</li><li>先只做“房主主动退出时交接”（约 1 周，覆盖大多数情况），崩溃迁移之后再补。</li><li>大厅显示 ping，引导网络最好的人当房主。</li><li>开局前写清楚怒退和掉线怎么算。</li><li>先把人数上限定在 8 人，稳定后再开到 12。</li><li>游戏单人也要完整可玩，联机出问题时还有退路。</li></ul></div><div class="ovc"><div class="ovh">🪂 退路</div><p><b>备选方案：</b>不换主</p><ol class="fb"><li>秒级换主也不稳 → 改成“房主走就体面散场”</li><li>人多卡顿 → 上限降到 8 人</li><li>对打争议太多 → 改成帧不敏感玩法，或改为合作 PVE</li><li>联机整体不顺 → 先保证单人可玩，用 Steam 远程同乐（最多 4 人、只需房主有游戏）兜底</li></ol></div><div class="ovc wide adv"><div class="ovh">💡 如果我是你</div><p><b>不建议用第一款游戏碰这一格。如果玩法允许，建议改成下面这个更好做的组合。</b> 只改一个条件的话，推荐 #16（PVP × 帧不敏感 × 秒级换主 × 7–12 人，结论“可行”，难度 3/5、胜率 50–60%）。</p><p class="muted">一句话结论：不建议。</p></div></div></template><template id="t23"><div class="dhead"><span class="cid">#23</span><b>PVP × 帧敏感 × 无感换主 × 4–6 人</b><span class="badge st-critical"><span class="bi" aria-hidden="true">✕</sp
