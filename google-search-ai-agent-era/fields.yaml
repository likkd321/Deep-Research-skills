  对谷歌搜索收入的影响:
    - name: impact_on_google_revenue
      description: 该维度对谷歌搜索/广告收入(或整体变现)的实际或潜在影响，含正反两面与量级判断。
      detail_level: 简要

  争议与不确定性:
    - name: controversies_and_uncertainties
      description: 存在争议、口径分歧、尚未验证或前景不确定之处；官方口径与第三方口径的差异。
