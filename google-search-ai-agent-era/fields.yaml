topic: AI/Agent时代对谷歌搜索业务的影响及谷歌的应对

fields:
  核心结论:
    - name: core_conclusion
      description: 针对该item对应的核心问题，给出直接、明确的结论(先说观点，再给依据)。判断用户引用的"那个AI"说法哪里对、哪里片面或错误。
      detail_level: 详细

  关键数据与成果:
    - name: key_data_and_results
      description: 可量化的关键数据、指标、财报数字、增长/下降幅度、第三方研究结论。每条尽量标注出处与时间。
