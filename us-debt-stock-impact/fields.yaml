# 字段定义（每个 item 都按这 13 个字段输出）
# 校验规则：JSON 顶层 key 必须逐一覆盖下列全部字段名（缺失=校验失败）。
# 不确定的字段：值写 "[不确定]" 并把字段名列入 JSON 末尾的 uncertain 数组。
# 所有字段值用中文。数字务必带日期与来源。
fields:
  现状与数据:
    - name: 关键数据
      description: 该维度最新量化指标，每条带（值 + 日期 + 来源）；优先 2025–2026；数字有口径差异时并列并注明口径
      detail_level: 详细
    - name: 近期变化
      description: 2024–2026 的关键进展、转折或政策/市场事件（相对我知识截止后的新变化尤其重要）
      detail_level: 详细
  机制与逻辑:
    - name: 核心机制
      description: 该维度的运行机制与因果链（为什么会这样、如何演化）
      detail_level: 详细
    - name: 隐喻映射
      description: 在"国债=引力 / 货币金融手段=斥力(简并压) / 恒星生命周期阶段"隐喻中，本维度对应什么角色，并给出该维度独立看指向哪个恒星阶段
      detail_level: 简要
  对股市影响:
    - name: 传导到股市
      description: 本维度经由哪些通道影响美股（贴现率/ERP/流动性/相关性/板块轮动等），方向与力度
      detail_level: 详细
    - name: 历史幅度与修复
      description: 可比历史情形下美股回撤幅度(%)、受冲击/受益板块与风格、以及修复形态与时长(V/U/L 型、几天/几周/几月)
      detail_level: 详细
  风险与时点:
    - name: 触发条件与催化剂日历
      description: 可监测的触发条件与领先指标 + 具体的近期催化剂日期（如 FOMC、拨款悬崖、拍卖、数据发布、信托基金/上限时点）
      detail_level: 详细
    - name: 时点估计
      description: 该维度风险最可能兑现的时点区间（近月 / 1 年内 / 1–3 年 / 结构性长期），并说明依据
      detail_level: 简要
    - name: 概率估计_分窗口
      description: 分 6 个月 / 12 个月 / 24 个月三档给出该维度触发显著风险的概率（区间百分比）+ 简要依据
      detail_level: 详细
    - name: 缓解因素
      description: 对冲、缓解或延缓该风险的因素（政策空间、制度约束、结构性买盘等）
      detail_level: 简要
  判断与来源:
    - name: 反方观点
      description: 针对本维度的怀疑论/反末日证据（为什么"没那么糟"），刻意纳入以避免报告系统性偏向灾难叙事
      detail_level: 简要
    - name: 一句话结论与不确定性
      description: 该维度一句话核心结论 + 最大的 1–2 个不确定性/争议
      detail_level: 简要
    - name: 一手来源
      description: 权威来源链接列表；区分"官方一手统计"(Treasury/Fed/CBO/BEA/FRED 原始序列) 与"专业二手解读"(评级机构/CRFB/PIIE/BIS/媒体)
      detail_level: 详细
uncertain: []
