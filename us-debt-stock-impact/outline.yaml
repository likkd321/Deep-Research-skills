topic: 美国国债可持续性与对美股的冲击（引力—斥力—恒星阶段框架）

# 用户原始问题（贯穿全篇的隐喻）：
#   国债 = 向内的引力（坍缩趋势）；加息等纯金融/货币手段 = 抵抗坍缩的"简并压/斥力"。
#   问：斥力还能顶多久？美国当前处于恒星生命周期的哪个阶段（主序 / 红巨星 / 白矮星 / 中子星 / 黑洞）？
#   用户主要关注股市：国债问题对美股第一波冲击"会怎样、多久之后、概率多大"。
# 基准日期：2026-09-21。所有数据尽量用 2025–2026 最新值，标日期+来源。

items:
  - name: 债务规模可持续性与内部时钟
    category: 引力之源
    description: >
      量化"引力"的质量与坍缩趋势。覆盖：联邦债务总额（gross，2026-09 约 40 万亿+）、公众持有债务、
      gross 债务/GDP（2026Q1 约 122.6%，注意与 IMF 一般政府口径 123.9% 的口径差异）、公众持有债务/GDP
      （FY2025 约 99.8%，CBO 预测 2036 约 120%、2056 约 175%）、FY2025 赤字 1.8 万亿(约 5.9%GDP)、
      FY2026 预测约 1.9 万亿、基础赤字(primary deficit)。特别纳入"内部时钟/日历确定的坍缩点"：
      社保 OASI 信托基金耗尽约 2032Q4、医保 HI 约 2033Q2（届时法定自动降给付至约 78%/89%）；
      以及 2026-02 最高法院推翻 IEEPA 关税导致约 1.4 万亿关税收入落空、退税加速这一意外财政恶化。
      映射：这是"恒星质量"本身有多大、坍缩趋势有多强。

  - name: 付息成本与r减g螺旋
    category: 引力自我强化
    description: >
      判断"引力"是否进入自我强化（滚雪球）。覆盖：净利息支出（FY2025 约 9700 亿、已超国防，FY2026 预计
      首破 1 万亿、约 3.3%GDP，CBO 预测 2036 达 2.1 万亿/4.6%GDP）；平均票息 vs 边际发行利率、再融资墙
      （大量低息债到期后按 ~5% 重定价）、加权平均期限 WAM（约 5.8 年）；r vs g 动态（10Y~5% vs 名义增长）；
      引用最新学术框架（如 NBER 2026 Eichengreen et al. "从存量到流量"：触发财政收紧的是偿付流而非债务/GDP 存量）。
      映射：利息滚雪球=引力随坍缩自我加强（越缩越强），是判断"能否稳定"的关键非线性。

  - name: 美联储斥力工具箱极限与独立性
    category: 斥力本身
    description: >
      "斥力/简并压"的实测与极限。覆盖：政策利率路径（2025 年 9/10/12 三次降息至 3.50-3.75%，
      2026-09-16 时隔三年首次加息 25bp 至 3.75-4.00%，因伊朗冲突→油价→CPI 3.4%；点阵图年内或再加）；
      QT 于 2025-12-01 结束（累计缩表 2.2 万亿）后启动短端"储备管理购买"RMP；2025 年 9-10 月回购市场压力、
      SRF 创纪录使用（10/31 约 294 亿）、准备金降至约 2.8 万亿；SRF/常备回购/贴现窗/最后贷款人等工具；
      斥力上限=通胀与美元约束（财政主导 fiscal dominance，耶伦 2026-01 亦警告）；独立性压力测试实证：
      2026-06-29 最高法院 5-4 阻止解雇理事 Cook（确立"非因故不可解雇"），但 Warsh 于 2026-05 以 54-45 就任主席。
      映射：这就是抵抗坍缩的量子简并压——能在"增长熄火"后仍托住，但有 Chandrasekhar/TOV 式硬上限（通胀/货币信用）。

  - name: 需求端买家迁移拍卖健康度与期限溢价
    category: 斥力的燃料
    description: >
      判断"斥力的燃料/边际买家"是否充足。覆盖：外国官方持有（日本约 1.22 万亿最大、中国约 6944 亿、
      较 2013 峰值降约 42%）、美联储、货币基金/家庭、一级交易商；拍卖健康度（2026 年 bid-to-cover 走弱、
      一级交易商获配升至历史高位、tail 扩大，CRFB 2026-03 专门警示）；短期票据 bills 占比约 22%（超 TBAC 15-20% 上限）；
      期限溢价 term premium（ACM 10Y 模型，各源 0.6%-0.96% 有分歧，deep 阶段优先取 FRED THREEFYTP10 官方序列）；
      两个反向新结构：稳定币(GENIUS Act 2025-07)成为短端新增买盘(现约 2000 亿，2030 预测 4000 亿-2.3 万亿) vs
      各国央行加速购金(2026-01 金价 ATH 5589 美元、Q1 购金 244 吨创纪录)作为去美元化替代储备。
      映射：斥力要持续，得有人不断"供能"（买债）；边际买家是谁、能撑多久，决定斥力续航。

  - name: 主权评级债务上限与技术性违约风险
    category: 突发坍缩触发器
    description: >
      离散型（突发）坍缩触发器与其近期概率。覆盖：Moody's 2025-05 降至 Aa1（失去最后一个 AAA）、
      S&P AA+（2026-06 确认稳定）、Fitch AA+（2026-08 确认稳定、警告 FY2026 一般政府赤字 7.4% 为 AA 级最高）；
      三大机构当前均"已降完+展望稳定、无一负面观察"→近期(6-12 月)再降级概率偏低；债务上限经 OBBBA(2025-07,+5 万亿
      至 41.1 万亿)推迟至约 2027，故债务上限危机近期概率下调；2011 S&P 降级、2023 Fitch 降级、2013/2023 上限对峙的历史类比。
      映射：这是"外壳突然失稳"的离散触发——不一定马上来，但一旦来是断崖式。

  - name: 国债向美股的传导机制
    category: 引力斥力之争如何传到股市
    description: >
      核心回答用户"国债对股市怎样冲击"。覆盖传导通道：①贴现率/DCF（长端利率↑压估值，尤其长久期成长/科技）；
      ②股权风险溢价 ERP（注意反直觉：2026 年 CAPE 约 40.6 处 2000 年来最高，但 Damodaran 隐含 ERP 不降反升
      4.23%→4.45%，说明非简单"泡沫压缩 ERP"线性叙事）；③期限溢价重定价；④流动性/抵押品与"管道"风险——
      杠杆化基差交易(basis trade)/回购踩踏(类 2020-03)，BIS 2026-09 季报点名国债相对互换"变便宜"致高杠杆相对价值交易脆弱；
      ⑤"债市义警"bond vigilantes；⑥60/40 股债相关性转正（利率冲击时股债同跌）；⑦AI 资本开支叙事与美股集中度交叉脆弱性
      （BIS 提示 AI 动能减弱，若与债市冲击共振或是真正"第一波"）。给出各通道对不同板块/风格的差异。
      映射：这是引力—斥力拉锯的"引力波"如何抵达股市并摇动它。

  - name: 历史与活体冲击案例复盘
    category: 过往星震的幅度与时长
    description: >
      为"第一波冲击会怎样、多深、多久修复"提供经验标尺。逐个复盘并给标普回撤幅度+板块+修复形态(V/L/时长)：
      2011-08 美国降级、2013 taper tantrum、2018Q4、2020-03 疫情+基差踩踏、2022 利率冲击熊市、2023-03 SVB/区域银行、
      2023-08/10 财政担忧+长端飙升、以及最关键的"活体/预演"案例——2025-04 "解放日"关税冲击(标普两日约 -10%、
      30Y 三日最大涨幅自 1982、美元同步走弱=罕见美国"股债汇三杀")、2025 年 9-10 月回购压力(管道类)、
      2026-09-16 加息当日标普 -0.45% 次日反弹(V 形快修复=斥力尚有余量的信号)。区分"利率驱动"vs"信用/财政驱动"回撤。
      映射：历次"星震"的震级与恢复速度，用来校准当前处于哪个阶段、斥力余量还剩多少。

  - name: 全球财政主导横向对比与美元悖论
    category: 相对严重程度校准
    description: >
      判断"这是美国储备货币特权流失，还是发达市场普遍现象、美元仍是矮子里的将军"。覆盖：日本(JGB)、英国(金边债)、
      法国(2024-2025 财政政治危机)同期主权收益率/期限溢价上行，BIS/IMF 定性为全球性财政主导浪潮；
      美元悖论——尽管财政忧虑，DXY 反走强(约 100，Fed 相对更鹰)，说明"股债汇三杀"尚非常态、美元避险地位仍在；
      同时央行购金去美元化是慢变量。据此校准冲击的相对烈度与美元/黄金走向。
      映射：同一星系里别的恒星也在老化——美国是不是"最先坍缩"的那颗，决定资金外流方向与烈度。

  - name: 第一波冲击情景树时点概率与催化剂日历
    category: 直接回答第二问
    description: >
      直接回答"第一波冲击何时来、概率多大、会怎样"，并产出恒星阶段综合研判素材。构建情景树，每个情景给
      触发机制、领先指标、对美股冲击路径与幅度、以及"6 个月/12 个月/24 个月"三档概率：
      情景A 拍卖事故/需求罢工；B 期限溢价飙升(长端失控上行)；C 通胀反复迫使美联储继续加息(2026-09 已在发生的"温和第一波")；
      D 基差交易/回购管道踩踏(快而暴力)；E 债务上限危机(近期概率低，2027 才到期)；F 评级连锁降级(近期概率低)；
      G 美元融资压力/外资撤离；H 财政主导确认(慢变量、结构性)。给出"第一波可能已温和发生但尚未系统化"的判断。
      催化剂日历：FOMC 2026-10-27/28、2026-12-08/09(含点阵图)、政府拨款悬崖 2026-12-11(与 12 月 FOMC 同周)、
      债务上限约 2027。映射：综合判断美国当前恒星阶段与"距黑洞还有多远/多久"。

execution:
  batch_size: 9          # 一次性并行 9 个子 agent（单批，无批间等待）
  items_per_agent: 1     # 每个 agent 专注 1 个维度，保证深度
  output_dir: ./us-debt-stock-impact/results
  mode: performance      # 性能模式：deep 阶段子 agent 一律 Opus（本题判断/预测密集）
  # 最终 research-report 的跨 item 综合由主 agent(Opus) 完成，交付 HTML Artifact 报告页
  report_format: html_artifact
